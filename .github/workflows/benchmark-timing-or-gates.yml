name: benchmark-timing-or-gates

# Reusable job body, called twice by benchmark.yml: once with mode=timing (runs
# ONLY the timed prefill/decode measurement, skipping the base case AND the
# anchor/free-run/behavior/GPQA gates entirely) and once with mode=gates (runs
# ONLY those gates, skipping the timed measurement). Splitting these onto
# separate machines -- on top of the base case already being split across
# correctness-slice-1/2/3 -- means the anchor/free-run/behavior/GPQA gates no
# longer sit serially in front of (or behind) the timed measurement on the same
# machine. combine.yml's "Merge gates and timing into machine1" step
# reassembles one full score.json from the two before combine-parallel-
# correctness.sh runs.
#
# Not meant to be dispatched on its own -- workflow_call only.
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      reference_download_jobs:
        required: true
        type: string
      reference_min_free_gib:
        required: true
        type: string
      verify_transform:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  run:
    runs-on: blacksmith-12vcpu-macos-26
    # Reduced from the 720min expert-streaming-era budget: the dense Gemma
    # model downloads ~18.4 GB and runs timing/gates from RAM (the timing
    # machine also builds and measures the paired baseline). Still generous
    # until the recalibrated Gemma baseline pins real phase timings.
    timeout-minutes: 360
    environment: benchmark-private-prompts
    env:
      MLXFAST_PRIVATE_DIR: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
      MLXFAST_CORRECTNESS_GOLDEN_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/correctness_golden.json
      MLXFAST_GPQA_REFERENCE_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/gpqa_reference_cases.json
      MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/semantic_gpqa_answers.json
      MLXFAST_SEMANTIC_GPQA_RESULTS_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/semantic_gpqa_results.json
      MLXFAST_SUBMISSION_STATIC_REVIEW_RESULTS_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/submission_static_review.json
      MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
      MLXFAST_IS_SUBMISSION_BRANCH: ${{ (startsWith(github.ref_name, 'submissions/')) && '1' || '0' }}
      MLXFAST_PRIVATE_PROMPTS_R2_PRESENT: ${{ (secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_ENDPOINT != '' && secrets.R2_SECRET_ACCESS_KEY != '') && '1' || '0' }}
      MLXFAST_ANTHROPIC_PRESENT: ${{ secrets.ORG_ANTHROPIC_API_KEY != '' && '1' || '0' }}
      # Both hidden R2 objects below (the benchmark/correctness golden with
      # its embedded timed-prompt oracle, and the GPQA reference cases with
      # accepted token sequences) have been regenerated from the Gemma 4 31B
      # 4-bit reference; these paths are valid once the regenerated objects
      # are uploaded to R2. See docs/gemma-migration-r2-checklist.md.
      MLXFAST_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/golden_prompt_benchmark_transcription_gate_english_512_256-gemma.json
      MLXFAST_GPQA_R2_PATH: correctness_prompts/gpqa_reference_cases-gemma.json
      MLXFAST_GPQA_CASE_COUNT: "5"
      # 64-token GPQA behavior/semantic budget and 0/5 threshold: calibrated
      # to the unmodified Gemma 4 31B 4-bit baseline (run 28817200585 judged
      # 0/5 at this 64-token budget; run 28813130022 judged 0/5 at the old
      # 10-token budget). Keep these three in sync with
      # MLXFastConstants.{correctnessGPQAMaxNewTokens,semanticGPQAMaxNewTokens,
      # semanticGPQAMinPassCount} -- the semantic capture is a prefix of the
      # behavior-gate generation, so the two MAX_NEW_TOKENS values move together.
      MLXFAST_GPQA_MAX_NEW_TOKENS: "64"
      MLXFAST_SEMANTIC_GPQA_CASE_COUNT: "5"
      MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS: "64"
      MLXFAST_SEMANTIC_GPQA_MIN_PASS: "0"
      MLXFAST_SEMANTIC_GPQA_REQUIRED: "1"
      MLXFAST_SEMANTIC_GPQA_MODEL: claude-sonnet-4-5-20250929
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: .cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
      MLXFAST_EXPECTED_CORRECTNESS_STEPS: "64"
      MLXFAST_TRUSTED_BENCHMARK_REF: ${{ github.ref }}
      MLXFAST_VERIFY_TRANSFORM: ${{ inputs.verify_transform && '1' || '0' }}
      # Both machines skip the base case entirely -- correctness-slice-1/2/3
      # cover it. mode selects which of the two remaining halves this machine
      # runs; see the harness-level comment on BenchmarkOptions for why running
      # neither (or, structurally impossible here, both) is invalid.
      MLXFAST_BENCHMARK_CORRECTNESS_STEPS: "0"
      MLXFAST_BENCHMARK_CHECK_GATES: ${{ inputs.mode == 'gates' && '1' || '0' }}
      MLXFAST_BENCHMARK_SKIP_TIMED: ${{ inputs.mode == 'gates' && '1' || '0' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted workflow context
        run: .github/scripts/enforce-trusted-benchmark-workflow.sh

      - name: Review submitted code for benchmark bypasses
        if: ${{ startsWith(github.ref_name, 'submissions/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Review only the editable files changed vs the merge-base -- see the
          # diff-only-mode comment in run-submission-static-review.sh. Standalone
          # assignment: a merge-base failure must fail this step; as a command
          # prefix its failure would be masked by bash and the review would
          # silently fall back to the whole editable surface.
          base_sha="$(git merge-base origin/main "${HEAD_SHA}")"
          MLXFAST_SUBMISSION_REVIEW_BASE_SHA="${base_sha}" \
            .github/scripts/run-submission-static-review.sh

      - name: Enforce modifiable surface
        if: ${{ startsWith(github.ref_name, 'submissions/') }}
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="$(git merge-base origin/main "${HEAD_SHA}")" \
            .github/scripts/enforce-modifiable-surface.sh

      - name: Probe runtime worker sandbox
        run: .github/scripts/probe-runtime-worker-sandbox.sh

      - name: Check correctness golden source
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${MLXFAST_CORRECTNESS_GOLDEN_PATH}")"
          if [[ "${MLXFAST_PRIVATE_PROMPTS_R2_PRESENT}" != "1" ]]; then
            echo "benchmark-timing-or-gates: hidden GPQA behavior gate requires private R2 secrets" >&2
            exit 1
          fi
          if [[ "${MLXFAST_ANTHROPIC_PRESENT}" != "1" ]]; then
            echo "benchmark-timing-or-gates: semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi

      - name: Restore SwiftPM cache
        id: restore_swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: ${{ secrets.MLXFAST_REFERENCE_BASE_URL || 'https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main' }}
          MLXFAST_REFERENCE_AUTH_HEADER: ${{ secrets.MLXFAST_REFERENCE_AUTH_HEADER }}
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: ${{ inputs.reference_download_jobs }}
          MLXFAST_REFERENCE_MIN_FREE_GIB: ${{ inputs.reference_min_free_gib }}
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
        run: ./setup.sh

      - name: Save SwiftPM cache
        if: ${{ steps.restore_swiftpm_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: ${{ steps.restore_swiftpm_cache.outputs.cache-primary-key }}

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Prepare correctness golden
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # PARITY CONTRACT: attach-gpqa-gates augments the raw golden with GPQA
          # behavior gates but MUST NOT mutate its .cases (the base teacher-forced
          # case). The three correctness-slice machines verify the base case
          # against the RAW golden (pinned by MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_
          # SHA256 = a593..e92cb25); this machine verifies gates against the
          # augmented golden. Both must agree on .cases or the split would check
          # the base case against a different fixture than it reports. That
          # agreement is backstopped by checked_steps/case_count equality in
          # combine-parallel-correctness.sh -- if attach-gpqa-gates ever starts
          # touching .cases, that coverage check is what catches it.
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_CORRECTNESS_GOLDEN_PATH}"
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_GPQA_R2_PATH}" \
            "${MLXFAST_GPQA_REFERENCE_PATH}"
          .build/release/mlxfast-swift attach-gpqa-gates \
            --golden "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" \
            --gpqa "${MLXFAST_GPQA_REFERENCE_PATH}" \
            --tokenizer weights \
            --output "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" \
            --case-count "${MLXFAST_GPQA_CASE_COUNT}" \
            --max-new-tokens "${MLXFAST_GPQA_MAX_NEW_TOKENS}"
          actual_hash="$(shasum -a 256 "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | tr -d ' ')"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256="${actual_hash}"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES="${actual_bytes}"
          {
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256=${actual_hash}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES=${actual_bytes}"
          } >> "${GITHUB_ENV}"
          echo "benchmark-timing-or-gates: using private GPQA-augmented correctness golden ${actual_hash} bytes=${actual_bytes}"
          .github/scripts/verify-correctness-golden.sh

      # Public drift tripwire, gates machine only. Ranked validation otherwise
      # exercises exclusively the hidden goldens, so a submission whose numerics
      # drift on prompts the hidden gates happen not to cover can be promoted
      # into main and then fail every participant's local public gate (issue
      # #83: frontier submission 53b6b82a flipped longcopy-gate-english-512
      # step 5 while passing the full hidden stack). The checked-in public
      # fixture is one more independent 64-step teacher-forced net, run BEFORE
      # the hidden gates so honest drift fails in ~6 minutes instead of after
      # the full GPQA stack. This is a tripwire for accidental behavior change,
      # NOT a security boundary: the fixture is public and therefore
      # memorizable in principle -- the hidden gates and the static review
      # remain the adversarial defenses. Runs only on the gates machine so the
      # timing machine's thermal/workload state stays untouched before
      # measurement. The fixture hash is pinned so a tampered checkout cannot
      # swap the oracle; submissions cannot touch correctness_prompts/ (outside
      # editablePaths), so this pin guards operator mistakes, not submissions.
      - name: Public behavior gate
        if: ${{ inputs.mode == 'gates' }}
        # Shell locals rather than step env: nothing here is secret (the fixture
        # is checked in), but keeping it out of the environment means the
        # sandboxed worker's env is byte-identical between this step and the
        # hidden gates, so submitted code gets no new phase-detection signal.
        run: |
          set -euo pipefail
          # Pinned to the checked-in Gemma 4 31B 4-bit public fixture
          # generated with `mlxfast-swift generate-golden`; regenerating the
          # fixture must move this pin (enforced by BenchmarkScriptTests).
          public_golden="correctness_prompts/public_longcopy_gate_english_512_256.json"
          public_golden_sha256="7c33861bdf062b08a96a97bf5b388b541edc95b4cc46afc4f98ce9cb46856782"
          actual_hash="$(shasum -a 256 "${public_golden}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${public_golden_sha256}" ]]; then
            echo "benchmark-timing-or-gates: public correctness golden hash mismatch (${actual_hash})" >&2
            exit 1
          fi
          status=0
          started="${SECONDS}"
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "benchmark-timing-or-gates: running public behavior gate with process logs suppressed"
            .build/release/mlxfast-swift correctness \
              --weights weights \
              --golden "${public_golden}" \
              > public-gate-report.json \
              2> "${RUNNER_TEMP}/mlxfast-public-gate-private.log" || status=$?
          else
            .build/release/mlxfast-swift correctness \
              --weights weights \
              --golden "${public_golden}" \
              > public-gate-report.json || status=$?
          fi
          # The report only ever references the checked-in public fixture, so
          # surfacing the mismatch position and tokens leaks nothing hidden and
          # gives participants an actionable failure.
          jq -r '"benchmark-timing-or-gates: public gate passed=\(.passed) checked_steps=\(.checked_steps) first_failing_step=\(.first_failing_step) expected_token=\(.expected_token) actual_token=\(.actual_token)"' \
            public-gate-report.json || true
          echo "benchmark-timing-or-gates: public behavior gate finished in $((SECONDS - started))s"
          exit "${status}"
      # Paired baseline measurement, timing machine only. Speedups and floors
      # were previously computed against constants measured on a different
      # physical host at a different hour; observed fleet drift is ~4-10% on
      # prefill and ~4% on decode across one day (see the paired-baseline
      # section of docs/benchmark-window-freeze.md), which made single-sample
      # floor verdicts near the threshold a coin flip. Measuring the pinned
      # reference implementation in the same session, on the same VM, minutes
      # before the candidate cancels that drift for both the score and the
      # floors. The ref below is trusted-workflow content (submission branches
      # must match main outside editablePaths), so submitted code can neither
      # repoint it nor observe the measured values (the env overrides are
      # stripped from the sandboxed worker environment by the harness).
      - name: Checkout paired baseline reference
        if: ${{ inputs.mode == 'timing' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Reference implementation: main at eff7e7f, the Gemma 4 31B 4-bit
          # migration merge (PR #352). This is the same code the calibrated
          # constants were measured against (gemma-baseline-timing-probe run
          # 28809531890). Changing this ref is a ranking-contract change:
          # follow the freeze doc's paired-baseline protocol and update the
          # pinned guard test.
          ref: eff7e7f2c85a5a6cef11110442ba4624a6ab3986
          path: paired-baseline
          persist-credentials: false

      - name: Measure paired baseline
        if: ${{ inputs.mode == 'timing' }}
        env:
          # Calibrated constants, used ONLY as a sanity band anchor here (the
          # guard test pins these to MLXFastConstants). A baseline sample more
          # than 1.5x slower or 0.66x faster than calibration means the VM or
          # the baseline build is pathological; failing closed prevents a
          # broken baseline from inflating or deflating every speedup.
          MLXFAST_PAIRED_SANITY_PREFILL: "0.01010573933984375"
          MLXFAST_PAIRED_SANITY_DECODE: "0.131727461265625"
        run: |
          set -euo pipefail
          started="${SECONDS}"
          # Build FIRST: SwiftPM replaces .build/release with a symlink to the
          # arch directory during the build, so anything copied in beforehand
          # is wiped. Then reuse the already-built MLX metallib -- the baseline
          # ref pins the same mlx-swift revision (guard-tested), so the
          # artifact is identical and rebuilding it would waste ~minutes; a
          # worker without it dies on its first Metal op.
          (
            cd paired-baseline
            mkdir -p .build/clang-module-cache
            export CLANG_MODULE_CACHE_PATH="${PWD}/.build/clang-module-cache"
            swift build -c release
          )
          test -s .build/release/mlx.metallib
          cp .build/release/mlx.metallib paired-baseline/.build/release/mlx.metallib
          test -s paired-baseline/.build/release/mlx.metallib
          baseline_score="${GITHUB_WORKSPACE}/paired-baseline-score.json"
          status=0
          (
            cd paired-baseline
            export MLXFAST_SCORE_PATH="${baseline_score}"
            export MLXFAST_INTEGRITY_PATH="${GITHUB_WORKSPACE}/paired-baseline-integrity.json"
            export MLXFAST_REFERENCE_DIR="${GITHUB_WORKSPACE}/${MLXFAST_REFERENCE_DIR}"
            ./benchmark.sh
          ) || status=$?
          # The baseline's OWN floor verdict is measured against its checked-in
          # constants and legitimately fails on a slow-fleet session -- exactly
          # the drift this pairing exists to cancel -- so tolerate a floor
          # failure but nothing else: token mismatches or harness errors must
          # fail the run.
          test -s "${baseline_score}"
          jq -e '
            (.metrics.first_failing_case == null)
            and (.metrics.first_failing_step == null)
            and (.metrics.expected_token == null)
            and (.metrics.actual_token == null)
            and ((.metrics.error == "") or (.metrics.error | startswith("performance floor failed")))
            and (.metrics.prefill_seconds_per_token > 0)
            and (.metrics.decode_seconds_per_token > 0)
          ' "${baseline_score}" >/dev/null || {
            echo "::error::paired baseline run did not produce a clean timed measurement (exit=${status})" >&2
            exit 1
          }
          jq -e \
            --argjson sanity_prefill "${MLXFAST_PAIRED_SANITY_PREFILL}" \
            --argjson sanity_decode "${MLXFAST_PAIRED_SANITY_DECODE}" \
            '
            (.metrics.prefill_seconds_per_token / $sanity_prefill) as $prefill_ratio
            | (.metrics.decode_seconds_per_token / $sanity_decode) as $decode_ratio
            | ($prefill_ratio >= 0.66 and $prefill_ratio <= 1.5
               and $decode_ratio >= 0.66 and $decode_ratio <= 1.5)
            ' "${baseline_score}" >/dev/null || {
            echo "::error::paired baseline measurement is outside the sanity band vs calibrated constants" >&2
            exit 1
          }
          prefill="$(jq -r '.metrics.prefill_seconds_per_token' "${baseline_score}")"
          decode="$(jq -r '.metrics.decode_seconds_per_token' "${baseline_score}")"
          {
            echo "MLXFAST_PAIRED_BASELINE_PREFILL_SECONDS_PER_TOKEN=${prefill}"
            echo "MLXFAST_PAIRED_BASELINE_DECODE_SECONDS_PER_TOKEN=${decode}"
          } >> "${GITHUB_ENV}"
          echo "benchmark-timing-or-gates: paired baseline prefill=${prefill} decode=${decode} baseline_exit=${status} seconds=$((SECONDS - started))"

      - name: Benchmark
        env:
          MLXFAST_NOTE: "ci ${{ github.event_name }} ${{ github.sha }} mode=${{ inputs.mode }}"
          MLXFAST_SKIP_TRANSFORM: "1"
        run: |
          set -euo pipefail
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "benchmark-timing-or-gates: running submitted benchmark (${{ inputs.mode }}) with private process logs suppressed"
            started="${SECONDS}"
            ./benchmark.sh > "${RUNNER_TEMP}/mlxfast-benchmark-private.log" 2>&1 &
            pid="$!"
            while kill -0 "${pid}" 2>/dev/null; do
              sleep 60
              if kill -0 "${pid}" 2>/dev/null; then
                echo "benchmark-timing-or-gates: submitted benchmark still running elapsed=$((SECONDS - started))s"
              fi
            done
            wait "${pid}"
          else
            ./benchmark.sh
          fi

      - name: Semantic GPQA gate
        # Semantic GPQA answers are captured during the behavior-gate pass, so
        # only the gates machine has anything for this step to judge.
        if: ${{ inputs.mode == 'gates' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "benchmark-timing-or-gates: semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          .github/scripts/run-semantic-gpqa-gate.sh

      - name: Hash transformed weights
        if: always()
        run: .github/scripts/hash-weights-directory.sh weights weights.sha256

      # Mirrors the "Validate correctness artifacts"/"Validate correctness slice
      # artifacts" gates elsewhere in this pipeline: on a real gates-mode gate
      # mismatch, ScoreMetrics.firstFailingCase/firstFailingStep are populated
      # directly from the hidden golden fixture (case/GPQA-question identifiers).
      # deny-private-artifacts.sh only checks filenames, not JSON content, so
      # without this the raw score.json would otherwise reach the unconditional
      # upload below. Only asserts the security-critical leak fields and overall
      # pass/fail -- NOT mode-specific business fields (gpqa_ttft_passed,
      # decode_speedup, etc), which validate-benchmark-artifacts.sh already
      # checks thoroughly downstream on the merged score.combined.json, and
      # which are legitimately absent/placeholder on one mode or the other here.
      - name: Validate intermediate benchmark artifact
        id: validate_intermediate_benchmark
        if: always()
        run: |
          set -euo pipefail
          test -s score.json
          jq -e \
            '
            def same_keys($expected):
              (keys_unsorted | sort) == ($expected | sort);

            same_keys(["metrics", "passed", "score"])
            and (.metrics | same_keys([
              "actual_token",
              "bandwidth_gb_per_token",
              "bandwidth_source",
              "baseline_decode_seconds_per_token",
              "baseline_prefill_seconds_per_token",
              "benchmark_wall_seconds",
              "case_count",
              "checked_steps",
              "commit",
              "correctness_seconds",
              "decode_seconds_per_token",
              "decode_speedup",
              "decode_speedup_floor",
              "error",
              "expected_token",
              "expert_bytes_read",
              "expert_cache_evictions",
              "expert_cache_hits",
              "expert_cache_misses",
              "expert_hit_rate",
              "expert_peak_cached_tensors",
              "expert_read_seconds",
              "first_failing_case",
              "first_failing_layer",
              "first_failing_step",
              "golden_hash",
              "gpqa_ttft_case_count",
              "gpqa_ttft_max_seconds",
              "gpqa_ttft_p50_seconds",
              "gpqa_ttft_pass_count",
              "gpqa_ttft_passed",
              "gpqa_ttft_seconds",
              "gpqa_ttft_source",
              "harness_hash",
              "max_abs_diff",
              "num_layers",
              "partial_result",
              "passed_correctness",
              "peak_ram_gb",
              "passed_decode_speedup_floor",
              "passed_prefill_speedup_floor",
              "prefill_seconds_per_token",
              "prefill_speedup",
              "prefill_speedup_floor",
              "preflight_seconds",
              "process_resident_memory_gb",
              "runtime",
              "semantic_gpqa_case_count",
              "semantic_gpqa_model",
              "semantic_gpqa_pass_count",
              "semantic_gpqa_passed",
              "timed_benchmark_seconds",
              "timestamp",
              "weights_byte_count",
              "weights_file_count",
              "weights_hash"
            ]))
            and .passed == true
            and (.metrics.error == "")
            and (.metrics.first_failing_case == null)
            and (.metrics.first_failing_layer == null)
            and (.metrics.first_failing_step == null)
            and (.metrics.expected_token == null)
            and (.metrics.actual_token == null)
            ' \
            score.json >/dev/null

      # A failing score.json cannot be uploaded (its error text and token
      # fields can leak hidden-golden values or submitted-code-controlled
      # content), and the private process log dies with the ephemeral runner
      # -- so until now every benchmark failure surfaced as an
      # indistinguishable "benchmark_failed". Derive and upload a REDACTED
      # failure category (floor / token mismatch / crash / no score) so
      # operators can tell WHY a run failed without widening the leak surface.
      - name: Surface redacted benchmark failure
        id: redact_benchmark_failure
        if: ${{ failure() }}
        env:
          MLXFAST_BENCHMARK_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          .github/scripts/redact-benchmark-failure.sh benchmark-failure.json
          .github/scripts/deny-private-artifacts.sh benchmark-failure.json

      # Deliberately NOT named benchmark-parallel-*: combine downloads that
      # prefix wholesale, and the failure record must never enter the combine
      # or scoring path -- it exists only for post-mortem triage.
      - name: Upload redacted benchmark failure
        if: ${{ failure() && steps.redact_benchmark_failure.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
          path: benchmark-failure.json
          if-no-files-found: error
          retention-days: 90

      - name: Prepare golden expectations for combine
        id: prepare_golden_expectations
        if: always()
        run: |
          set -euo pipefail
          test -s score.json
          test -s benchmark-integrity.json
          {
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256=${MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES=${MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_CHECKED_STEPS=${MLXFAST_EXPECTED_CORRECTNESS_CHECKED_STEPS}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_CASES=${MLXFAST_EXPECTED_CORRECTNESS_CASES}"
          } > golden-expectations.env

      - name: Check intermediate benchmark artifact paths
        id: deny_intermediate_paths
        if: ${{ always() && steps.prepare_golden_expectations.outcome == 'success' && ((!(startsWith(github.ref_name, 'submissions/'))) || steps.validate_intermediate_benchmark.outcome == 'success') }}
        run: |
          set -euo pipefail
          .github/scripts/deny-private-artifacts.sh \
            score.json \
            benchmark-integrity.json \
            weights.sha256 \
            golden-expectations.env

      - name: Upload intermediate benchmark result
        # Requires the deny-path check to have PASSED (not just run), matching
        # main's deny-before-upload ordering; deny success also transitively
        # implies prepare_golden_expectations succeeded and, on submission
        # branches, that the content validation passed.
        if: ${{ always() && steps.deny_intermediate_paths.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-parallel-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
          path: |
            score.json
            benchmark-integrity.json
            weights.sha256
            golden-expectations.env
          if-no-files-found: error
          # These per-machine intermediates are the only place each machine's
          # own timing/gates/RAM/expert provenance survives -- combine collapses
          # them into one score.json. Keep them as long as the final result so a
          # score dispute can still be traced to the contributing machine.
          retention-days: 90
