name: serial-benchmark

# LEGACY SERIAL RANKED PIPELINE (self-hosted Apple M5 Max, label m5-bench).
#
# This preserves the original one-token serial contract for explicit
# operator dispatches and benchmark.serial.json only. It is not Yukon's
# default workflow.
#
# This replaces the previous multi-job fan-out with ONE serial job on ONE
# self-hosted runner. On a dedicated box the serial order is what buys us a
# clean measurement (see "MEASUREMENT-DELTA ORDERING" below).
#
# Verdict semantics:
#   final pass = full 64-step teacher-forced base case
#              AND anchor/free-run/behavior/GPQA gates + GPQA TTFT
#              AND semantic GPQA judge (Anthropic)
#              AND public-fixture drift tripwire
#              AND paired timing accepted (thermal gate + telemetry acceptance)
#              AND both 0.95 speedup floors
#   score = decode_speedup^0.75 * prefill_speedup^0.25 from the paired timing,
#           null when any gate fails.
# The gates/base-case pass produces one harness score.json (base case and gates
# run in ONE `mlxfast-swift benchmark` invocation, so passed_correctness and
# correctness_seconds natively cover base+gates), the semantic judge patches
# it, and overlay-paired-timing.sh overlays the measured paired timing.
#
# MEASUREMENT-DELTA ORDERING (the crux):
# The timed prefill/decode measurement runs LAST, after all compute-heavy
# correctness/gates work, and is executed by /opt/bench-runner/measure-job.sh,
# whose thermal-stability contract is FIXED in that script (readonly, not
# env-overridable): every timed phase -- baseline and candidate, plus any
# oracle generation -- starts only once the GPU is below 40C (up to a 900s
# cooldown wait), runs under 2 Hz macmon telemetry, and is REJECTED if any
# loaded sample shows GPU clocks below 1600 MHz (throttling), if telemetry is
# missing, or if the sealed score shows token mismatches; one gated retry is
# allowed. This replaces the old "separate cold machine for timing" guarantee:
# the old pipeline bought thermal isolation by renting a fresh VM whose
# hardware lottery the paired baseline then had to cancel; here the SAME
# silicon measures candidate and pinned baseline back to back, each behind the
# same 40C gate, so the heavy correctness pass that ran minutes earlier cannot
# leak heat into the measurement (the gate blocks until it has dissipated) and
# cannot leave residual load (a quiescence wait + measure-job's own preflight
# reject load >= 2.0 / GPU util >= 10%). Timing also uses fresh worker
# processes: measure-job invokes ./benchmark.sh --official per side, and the
# harness spawns its per-phase runtime workers fresh inside that run, so no
# model/cache state survives from the correctness pass into the timed pass.
# The paired ratio (candidate vs the PINNED baseline tree at
# /opt/bench-runner/baseline/current, sanity-banded against
# /opt/bench-runner/state/baseline-calibration.json) cancels the remaining
# common-mode host drift exactly like the old separate-VM pairing did --
# validated on this box at paired score 1.0507 with decode CV 0.13%.
#
# ISOLATION (all four security rings preserved):
#   ring 0  trusted workflow steps run as the `runner` user: guards, R2/
#           Anthropic secret use, golden verification, score sealing,
#           artifact validation. Secrets and raw private artifacts live under
#           runner-only paths; the bench uid never sees R2/Anthropic secrets
#           (sudo env_reset strips the environment at the bridge, and
#           bench-exec's own denylist double-guards).
#   ring 1->2 bridge: EVERY invocation of submitted/branch code -- build,
#           transform, attach-gpqa-gates, public gate, correctness+gates,
#           and the timed benchmark (via measure-job) -- goes through
#           `sudo -n /opt/bench/bench-exec.sh <workspace> <cmd...>`, which
#           drops to the ephemeral `bench` uid (PF egress block, workspace
#           write confinement, process cap) and injects the hardened worker
#           Seatbelt profile via MLXFAST_RUNTIME_WORKER_SANDBOX_PROFILE +
#           MLXFAST_USE_RUNTIME_WORKER=1.
#   ring 3  the runtime worker (the only process that executes submitted
#           model code) additionally runs under that Seatbelt profile: no
#           network, no fork/exec (own binary excepted), writes confined to
#           the workspace, reads of the hidden golden denied by literal path
#           (BENCH_GOLDEN_PATH, kept through sudo env_keep).
#   post-job /opt/bench/janitor.sh wipes+recreates the bench uid and runs the
#           signed integrity audit; drift quarantines the box and fails the
#           run.
# Score sealing: the benchmark process's stdout is captured in the trusted
# shell and validated (exactly one JSON score object) before anything trusts
# it, mirroring benchmark.sh's own stdout-sealing -- any later tamper of
# on-disk files inside the bench-writable workspace is discarded, and the
# harness-authored benchmark-integrity score hash is cross-checked.
#
# Dispatch-only, like before: no PR/push triggers (GitHub self-hosted safety --
# fork PRs must never reach this runner). Dispatches are restricted to main,
# submissions/*, baseline/*, and yukon/baseline/*. Submission branches
# contribute only the exact dispatched SHA's editablePaths over trusted main;
# main and both baseline namespaces run their exact dispatched SHA.
# Submitted-process logs remain suppressed.
on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Run the private gates + timed benchmark after the public correctness gate. false = public-fixture correctness only."
        required: false
        default: true
        type: boolean
      verify_transform:
        description: "Run deterministic transform verification before timing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Ranked serving now spans two hardened, at-parity M5 boxes (both PF-locked-down,
# same pinned baseline ref 4475b88, cross-box timing measured ~0.01% decode /
# ~0.09% prefill apart). A per-run concurrency group lets dispatches run
# concurrently -- one per box -- instead of serializing behind a single global
# queue; actual concurrency is naturally bounded by the number of online
# m5-bench runners (2). cancel-in-progress stays false so no ranked run is ever
# cancelled out from under a box mid-measurement.
concurrency:
  group: mlxfast-ranked-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ranked:
    name: "single-machine ranked benchmark (m5-bench)"
    runs-on: [self-hosted, m5-bench]
    # Serial budget: build (~15m) + transform (~10m) + public gate (~10m) +
    # base case + gates (~45m) + cooldowns (up to 900s per timed phase) +
    # paired timing. Generous until recalibrated.
    timeout-minutes: 360
    environment: benchmark-private-prompts
    env:
      # --- Host contract: provisioned by the box operator, audited by the
      # janitor's signed manifest. The workflow only ever consumes these; it
      # never installs or mutates them.
      MLXFAST_BENCH_EXEC: /opt/bench/bench-exec.sh
      MLXFAST_JANITOR: /opt/bench/janitor.sh
      MLXFAST_MEASURE_JOB: /opt/bench-runner/measure-job.sh
      MLXFAST_QUARANTINE_FLAG: /opt/bench/quarantine.flag
      MLXFAST_MACMON: /opt/bench-runner/bin/macmon
      MLXFAST_BASELINE_WS: /opt/bench-runner/baseline/current
      MLXFAST_BASELINE_CALIBRATION: /opt/bench-runner/state/baseline-calibration.json
      MLXFAST_MEASURE_STATE_DIR: /opt/bench-runner/state
      # Reference checkpoint pre-provisioned in the runner-owned cache
      # (world-readable; verified against the pinned manifest below every
      # run). No download happens on this box, so the old
      # reference_download_jobs/reference_min_free_gib inputs are gone.
      MLXFAST_REFERENCE_DIR: /opt/bench-runner/cache/huggingface/hub/models--mlx-community--Laguna-XS-2.1-4bit/snapshots/main
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_laguna_xs_2_1_4bit.sha256
      # Bench workspace: the ONLY place submitted code executes and writes.
      # Must live under /Users/Shared/bench-jobs (bench-exec refuses anything
      # else). The path is STABLE across runs (not per-run) because llbuild's
      # build records store absolute paths: the trusted build-products cache
      # below only avoids recompiling ~235 dependency modules if the workspace
      # sits at the same absolute path every run. Safe because each box runs
      # exactly one ranked job at a time (one ephemeral runner registration per
      # box) and "Prepare bench workspace" starts with rm -rf; per-run identity
      # lives in BENCH_JOB_ID and the per-run private/artifact dirs below.
      MLXFAST_JOB_WS: /Users/Shared/bench-jobs/ranked-current
      # --- Runner-only private material, same /tmp/mlxfast-private-* naming
      # convention as the VM pipeline. The directory is created 0700 runner,
      # so neither the bench parent nor the worker (both the bench uid) can
      # read it; the janitor's bench-uid purge never touches runner-owned
      # files.
      MLXFAST_PRIVATE_DIR: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_CORRECTNESS_GOLDEN_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}/correctness_golden.json
      MLXFAST_TIMED_DECODE_PROMPT_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}/timed_decode_prompt.txt
      MLXFAST_SEMANTIC_GPQA_RESULTS_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}/semantic_gpqa_results.json
      MLXFAST_SUBMISSION_STATIC_REVIEW_RESULTS_PATH: /tmp/mlxfast-private-${{ github.run_id }}-${{ github.run_attempt }}/submission_static_review.json
      MLXFAST_ARTIFACT_ROOT: /tmp/mlxfast-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_MEASURE_OUT: /tmp/mlxfast-measure-${{ github.run_id }}-${{ github.run_attempt }}
      # --- Benchmark contract (identical values to the previous pipeline).
      MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
      MLXFAST_PRIVATE_PROMPTS_R2_PRESENT: ${{ (secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_ENDPOINT != '' && secrets.R2_SECRET_ACCESS_KEY != '') && '1' || '0' }}
      MLXFAST_ANTHROPIC_PRESENT: ${{ secrets.ORG_ANTHROPIC_API_KEY != '' && '1' || '0' }}
      # The timed target's bytes remain private in R2. Its digest and byte count
      # are non-secret Environment variables so the trusted workflow can pin
      # the exact fixture while operators rotate it without publishing it.
      # Keep the ID in sync with
      # MLXFastConstants.benchmarkEvaluationTargetID.
      MLXFAST_TIMED_DECODE_TARGET_ID: lowsim-prose-v1
      MLXFAST_TIMED_DECODE_PROMPT_SHA256: ${{ vars.MLXFAST_TIMED_DECODE_PROMPT_SHA256 }}
      MLXFAST_TIMED_DECODE_PROMPT_BYTES: ${{ vars.MLXFAST_TIMED_DECODE_PROMPT_BYTES }}
      # The private R2 object KEYS (MLXFAST_CORRECTNESS_GOLDEN_R2_PATH /
      # MLXFAST_GPQA_R2_PATH / MLXFAST_TIMED_DECODE_PROMPT_R2_PATH) are
      # deliberately NOT set at job level: job env is ambient to every step,
      # including the bench phases, so the private object names would
      # needlessly reach the untrusted bench environment. They are scoped to
      # their trusted download steps. (The operator denylist blocks them at the
      # bridge as defense in depth.)
      # The RAW (pre-GPQA-augmentation) hidden golden's pins -- the same object
      # the old slices verified. The augmented golden is verified against a
      # self-anchored hash computed right after attach-gpqa-gates, exactly as
      # the old gates machine did.
      MLXFAST_RAW_CORRECTNESS_GOLDEN_SHA256: 96689a9ceaf7cc813174d0a6cb2ab650454d7d031f88514cbd222bcb17bb4d7e
      MLXFAST_RAW_CORRECTNESS_GOLDEN_BYTES: "35749"
      MLXFAST_EXPECTED_CORRECTNESS_STEPS: "64"
      MLXFAST_GPQA_CASE_COUNT: "5"
      # 64-token GPQA behavior/semantic budget and min-pass 1 threshold:
      # calibrated to the unmodified Gemma 4 31B 4-bit rebase baseline, which
      # stably judges 2/5 on the M5-regenerated hidden prompts (five runs, see
      # MLXFastConstants.semanticGPQAMinPassCount). Keep in sync with
      # MLXFastConstants.{correctnessGPQAMaxNewTokens,semanticGPQAMaxNewTokens,
      # semanticGPQAMinPassCount}.
      MLXFAST_GPQA_MAX_NEW_TOKENS: "64"
      MLXFAST_SEMANTIC_GPQA_CASE_COUNT: "5"
      MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS: "64"
      MLXFAST_SEMANTIC_GPQA_MIN_PASS: "1"
      MLXFAST_SEMANTIC_GPQA_REQUIRED: "1"
      # Opus 4.8 at max effort (adaptive thinking): the Sonnet 4.5 judge
      # produced prose-wrapped/truncated verdicts (3 unparseable first
      # attempts in run 29124417146). The threshold calibration above was
      # judged by Sonnet; watch the first Opus-judged baseline runs against
      # the 2/5 expectation before trusting the margin.
      MLXFAST_SEMANTIC_GPQA_MODEL: claude-opus-4-8
      MLXFAST_GPQA_TTFT_CASE_COUNT: "5"
      # Public drift-tripwire fixture, pinned (enforced by BenchmarkScriptTests).
      MLXFAST_PUBLIC_CORRECTNESS_PROMPT_PATH: correctness_prompts/public_longcopy_gate_english_512.txt
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256: 679ba44220d581316c752533472883f4905a1b6a30f5f657a25f1177ae6247c1
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_BYTES: "10519"
      # Speedup floors; keep in sync with
      # MLXFastConstants.{scoreDecodeSpeedupFloor,scorePrefillSpeedupFloor}.
      # The old timing machine computed floor verdicts inside the harness from
      # the paired-baseline env override; here measure-job owns the timing, so
      # overlay-paired-timing.sh applies the same floors in the trusted shell.
      MLXFAST_DECODE_SPEEDUP_FLOOR: "0.95"
      MLXFAST_PREFILL_SPEEDUP_FLOOR: "0.95"
      MLXFAST_RUN_BENCHMARK: ${{ inputs.run_benchmark && '1' || '0' }}
      MLXFAST_CANDIDATE_SHA: ${{ github.sha }}
      MLXFAST_IS_SUBMISSION_BRANCH: ${{ startsWith(github.ref, 'refs/heads/submissions/') && '1' || '0' }}
      MLXFAST_VERIFY_TRANSFORM: ${{ inputs.verify_transform && '1' || '0' }}
      # POLICY (TOOLCHAINS override, ranked side): the ranked build must use
      # exactly ONE operator-chosen Metal toolchain. This pin is the
      # operator-installed Metal Toolchain on the m5-bench box (Metal build
      # 17E188); tools/build-mlx-metallib.sh exports TOOLCHAINS from it. The
      # value is injected into the bench build below as trusted argv through
      # the bench-exec bridge (sudo env_reset + env -i mean nothing submitted
      # code exports can reach that environment), so submissions cannot select
      # a different compiler. Participants remain free to override
      # MLXFAST_METAL_TOOLCHAIN_IDENTIFIER on their own machines. Update this
      # pin deliberately when the box's Metal Toolchain is upgraded; the
      # fingerprint step below fails fast if the pin and the installed
      # toolchain ever disagree.
      MLXFAST_METAL_TOOLCHAIN_IDENTIFIER: com.apple.dt.toolchain.Metal.32023.883
    steps:
      # Fail fast if the box is quarantined or the isolation stack is missing,
      # before any checkout or secret use. The bridge is root-only (0750
      # root:wheel), so only presence is asserted.
      - name: Host preflight
        run: |
          set -euo pipefail
          echo "host=$(hostname) chip=$(sysctl -n machdep.cpu.brand_string) user=$(id -un) uid=$(id -u)"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::box is quarantined (${MLXFAST_QUARANTINE_FLAG}); janitor detected drift -- see RUNBOOK" >&2
            exit 1
          fi
          test -e "${MLXFAST_BENCH_EXEC}" || { echo "::error::bench-exec bridge missing" >&2; exit 1; }
          test -e "${MLXFAST_JANITOR}" || { echo "::error::janitor missing" >&2; exit 1; }
          if [[ "${MLXFAST_RUN_BENCHMARK}" == "1" ]]; then
            test -x "${MLXFAST_MEASURE_JOB}" || { echo "::error::measure-job missing" >&2; exit 1; }
            test -x "${MLXFAST_MACMON}" || { echo "::error::macmon missing" >&2; exit 1; }
            test -d "${MLXFAST_BASELINE_WS}" || { echo "::error::pinned baseline workspace missing" >&2; exit 1; }
            test -s "${MLXFAST_BASELINE_CALIBRATION}" || { echo "::error::baseline calibration missing" >&2; exit 1; }
          fi
          test -f "${MLXFAST_REFERENCE_DIR}/config.json" || { echo "::error::reference checkpoint cache missing" >&2; exit 1; }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Submission branches contribute editable paths only; trusted main is
          # the harness/workflow base. Main, baseline/*, and yukon/baseline/*
          # run their exact SHA.
          ref: ${{ startsWith(github.ref, 'refs/heads/submissions/') && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted workflow context
        run: .github/scripts/enforce-trusted-serial-benchmark-workflow.sh

      - name: Capture candidate commit
        id: candidate_context
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate SHA must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi
          trusted_main_sha="$(git rev-parse HEAD)"
          printf '%s\n' "${CANDIDATE_SHA}" > candidate.sha
          printf 'trusted_main_sha=%s\n' "${trusted_main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          path: .mlxfast-submission-src
          fetch-depth: 0
          persist-credentials: false

      - name: Verify submitted commit and modifiable surface
        id: verify_submission
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_REF: ${{ github.sha }}
          TRUSTED_MAIN_SHA: ${{ steps.candidate_context.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          # All git plumbing against the untrusted submission worktree (and the
          # fetch that reads its object store) runs through hardened-git.sh, so a
          # planted .git/config / hooks / filters / fsmonitor in the submission
          # cannot execute as the runner uid.
          hardened_git="${GITHUB_WORKSPACE}/.github/scripts/hardened-git.sh"
          actual_sha="$("${hardened_git}" -C .mlxfast-submission-src rev-parse HEAD)"
          if [[ "${actual_sha}" != "${SUBMISSION_REF}" ]]; then
            echo "::error::submitted checkout resolved to ${actual_sha}, expected ${SUBMISSION_REF}" >&2
            exit 1
          fi
          if ! "${hardened_git}" -C .mlxfast-submission-src cat-file -e "${TRUSTED_MAIN_SHA}^{commit}"; then
            echo "::error::submitted checkout cannot resolve trusted main commit ${TRUSTED_MAIN_SHA}" >&2
            exit 1
          fi
          base_sha="$("${hardened_git}" -C .mlxfast-submission-src merge-base "${TRUSTED_MAIN_SHA}" "${actual_sha}")"
          if [[ "${base_sha}" != "${TRUSTED_MAIN_SHA}" ]]; then
            echo "::error::submission must be based on current trusted main ${TRUSTED_MAIN_SHA}; merge-base is ${base_sha}" >&2
            exit 1
          fi
          (
            cd .mlxfast-submission-src
            BASE_SHA="${base_sha}" HEAD_SHA="${actual_sha}" \
              "${GITHUB_WORKSPACE}/.github/scripts/enforce-modifiable-surface.sh"
          )
          # Keep the candidate commit object in the trusted repository for
          # provenance only. No candidate tree is checked out here.
          if ! "${hardened_git}" cat-file -e "${actual_sha}^{commit}"; then
            "${hardened_git}" fetch --no-tags .mlxfast-submission-src "${actual_sha}"
          fi
          "${hardened_git}" cat-file -e "${actual_sha}^{commit}"
          printf 'base_sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "benchmark: verified submitted commit ${actual_sha} against base ${base_sha}"

      - name: Review submitted code for benchmark bypasses
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ github.sha }}
          REVIEW_BASE_SHA: ${{ steps.verify_submission.outputs.base_sha }}
        run: |
          set -euo pipefail
          (
            cd .mlxfast-submission-src
            MLXFAST_SUBMISSION_REVIEW_BASE_SHA="${REVIEW_BASE_SHA}" \
              "${GITHUB_WORKSPACE}/.github/scripts/run-submission-static-review.sh"
          )

      - name: Overlay submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_WORKTREE: .mlxfast-submission-src
        run: .github/scripts/overlay-editable-paths.sh

      # The bench workspace must contain the trusted tree plus overlaid editable
      # paths only, never the candidate's complete checkout.
      - name: Remove submitted checkout
        if: ${{ always() && startsWith(github.ref, 'refs/heads/submissions/') }}
        run: |
          set -euo pipefail
          rm -rf .mlxfast-submission-src
          test ! -e .mlxfast-submission-src

      # Same Seatbelt-semantics probe the VM pipeline ran: proves this host's
      # sandbox-exec still denies golden reads, private-dir reads, non-workspace
      # writes, network, and fork/exec under a worker-shaped profile.
      - name: Probe runtime worker sandbox
        run: .github/scripts/probe-runtime-worker-sandbox.sh

      # Mirrors the old early secret checks: a run missing the R2 secrets or
      # the Anthropic key must fail here, not after the build+transform.
      - name: Check private material present
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          if [[ "${MLXFAST_PRIVATE_PROMPTS_R2_PRESENT}" != "1" ]]; then
            echo "::error::hidden correctness/GPQA gates require private R2 secrets" >&2
            exit 1
          fi
          if [[ "${MLXFAST_ANTHROPIC_PRESENT}" != "1" ]]; then
            echo "::error::semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          if [[ ! "${MLXFAST_TIMED_DECODE_PROMPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::timed decode prompt requires a pinned 64-character SHA-256 in the benchmark-private-prompts Environment" >&2
            exit 1
          fi
          if [[ ! "${MLXFAST_TIMED_DECODE_PROMPT_BYTES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::timed decode prompt requires a positive byte-count pin in the benchmark-private-prompts Environment" >&2
            exit 1
          fi

      # setup.sh's download path is not used on this box; this replaces its
      # post-download verification. Full content hash of every checkpoint file
      # against the pinned manifest, every run, so a corrupted or swapped cache
      # can never feed the transform.
      - name: Verify reference checkpoint against pinned manifest
        run: |
          set -euo pipefail
          test -s "${MLXFAST_REFERENCE_MANIFEST_PATH}"
          failures=0
          checked=0
          while read -r want_hash want_bytes rel_path; do
            [[ -z "${want_hash}" || "${want_hash}" == \#* ]] && continue
            path="${MLXFAST_REFERENCE_DIR}/${rel_path}"
            if [[ ! -f "${path}" ]]; then
              echo "::error::reference file missing: ${rel_path}" >&2
              failures=$((failures + 1))
              continue
            fi
            actual_bytes="$(wc -c < "${path}" | tr -d ' ')"
            actual_hash="$(shasum -a 256 "${path}" | awk '{print $1}')"
            if [[ "${actual_bytes}" != "${want_bytes}" || "${actual_hash}" != "${want_hash}" ]]; then
              echo "::error::reference file mismatch: ${rel_path}" >&2
              failures=$((failures + 1))
            fi
            checked=$((checked + 1))
          done < "${MLXFAST_REFERENCE_MANIFEST_PATH}"
          if [[ "${failures}" -ne 0 || "${checked}" -eq 0 ]]; then
            echo "::error::reference checkpoint failed manifest verification (checked=${checked} failures=${failures})" >&2
            exit 1
          fi
          echo "benchmark: reference checkpoint verified against pinned manifest (${checked} files)"

      # Dependency checkouts for BOTH SwiftPM roots: the trusted CLI resolves
      # into .build and the participant worker into its own .build-worker
      # scratch root, so the caches never share a build tree with each other.
      - name: Restore trusted SwiftPM dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
            .build-worker/checkouts
            .build-worker/repositories
            .build-worker/artifacts
            .build-worker/workspace-state.json
          key: swiftpm-trusted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Compute MLX Metal library cache fingerprint
        id: mlx_metallib_fingerprint
        run: |
          set -euo pipefail
          cmake_bin="$(command -v cmake 2>/dev/null || true)"
          if [[ -z "${cmake_bin}" ]]; then
            for candidate in /opt/homebrew/bin/cmake /usr/local/bin/cmake; do
              if [[ -x "${candidate}" ]]; then
                cmake_bin="${candidate}"
                break
              fi
            done
          fi
          test -x "${cmake_bin}"
          metal_toolchain_identifier="$(
            xcodebuild -showComponent MetalToolchain 2>/dev/null \
              | awk -F': ' '/Toolchain Identifier/ { print $2; exit }' \
              || true
          )"
          # The ranked pin and the box's installed Metal Toolchain must agree;
          # otherwise the cache fingerprint (detected toolchain) and the bench
          # build (pinned toolchain) could silently diverge.
          if [[ -n "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" \
              && "${metal_toolchain_identifier}" != "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" ]]; then
            echo "::error::installed Metal toolchain (${metal_toolchain_identifier:-none}) does not match the ranked pin (${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}); update the pin or the box deliberately" >&2
            exit 1
          fi
          # Two fingerprints from one probe:
          # - base_sha256 covers the toolchain + OS + package manifests and
          #   keys the SwiftPM build-products caches, whose staleness llbuild
          #   already resolves incrementally per source file;
          # - sha256 additionally folds in the vendored-source fingerprint of
          #   THIS work tree (computed after the submitted overlay) and keys
          #   the metallib cache, which is copied wholesale with no
          #   incremental rebuild. A submission that edits any vendored Metal
          #   or JIT kernel source therefore changes the metallib key, so a
          #   cached mlx.metallib (built from trusted main's sources) can
          #   never mask participant edits to the AOT-served kernels.
          vendored_metal_fingerprint="$(tools/build-mlx-metallib.sh --print-fingerprint)"
          test "${#vendored_metal_fingerprint}" -eq 64
          base_fingerprint="$({
            printf '%s\n' mlx-metallib-m5-max-v2
            uname -m
            sysctl -n machdep.cpu.brand_string
            sw_vers -buildVersion
            xcodebuild -version
            printf 'METAL_TOOLCHAIN_IDENTIFIER=%s\n' "${metal_toolchain_identifier}"
            xcrun --sdk macosx --show-sdk-build-version
            if [[ -n "${metal_toolchain_identifier}" ]]; then
              TOOLCHAINS="${metal_toolchain_identifier}" xcrun -sdk macosx metal -v 2>&1
            else
              xcrun -sdk macosx metal -v 2>&1
            fi
            "${cmake_bin}" --version
            shasum -a 256 Package.swift Package.resolved tools/build-mlx-metallib.sh
          } | shasum -a 256 | awk '{print $1}')"
          test "${#base_fingerprint}" -eq 64
          fingerprint="$({
            printf 'BASE_FINGERPRINT=%s\n' "${base_fingerprint}"
            printf 'VENDORED_METAL_FINGERPRINT=%s\n' "${vendored_metal_fingerprint}"
          } | shasum -a 256 | awk '{print $1}')"
          test "${#fingerprint}" -eq 64
          printf 'sha256=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"
          printf 'base_sha256=%s\n' "${base_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore trusted MLX Metal library cache
        id: restore_mlx_metallib_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mlxfast-cache/mlx.metallib
            .mlxfast-cache/mlx.metallib.fingerprint
          key: mlx-metallib-m5-max-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.sha256 }}

      # Belt-and-suspenders on top of the fingerprint-keyed cache: the
      # restored metallib's recorded source fingerprint must match the
      # vendored sources in THIS work tree, or the cached artifact is
      # discarded and the bench build compiles a fresh metallib from the
      # (possibly overlaid) sources.
      - name: Verify restored MLX Metal library
        env:
          CACHE_HIT: ${{ steps.restore_mlx_metallib_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == "true" ]]; then
            test -s .mlxfast-cache/mlx.metallib
            test -s .mlxfast-cache/mlx.metallib.fingerprint
            expected_record="mlxfast-metallib-fingerprint-v1 $(tools/build-mlx-metallib.sh --print-fingerprint)"
            restored_record="$(cat .mlxfast-cache/mlx.metallib.fingerprint)"
            if [[ "${restored_record}" != "${expected_record}" ]]; then
              echo "::warning::restored mlx.metallib does not match the vendored Metal sources in this work tree; discarding it so the bench build recompiles"
              /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
            fi
          else
            /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
          fi

      # Compiled build products for both SwiftPM roots (dependency object
      # files, build database, release products), saved ONLY from main-ref
      # dispatches -- the same anti-poisoning gate as the metallib cache: on
      # main there is no submitted overlay, so the staged trees derive purely
      # from trusted sources. The trusted CLI root (.build) and the
      # participant worker root (.build-worker) are staged and cached as two
      # separate entries so the participant-shaped products never share a
      # cache namespace with the trusted CLI's. Submission runs restore both
      # and `swift build` then recompiles only the overlaid editable modules
      # plus the link, instead of all ~235 modules (~10 minutes -> ~1-2
      # minutes). The keys reuse the metallib fingerprint (toolchain + OS +
      # Package manifests): dependency objects are exactly as reusable as the
      # metallib. Trusted first-party modules that changed since the cache was
      # saved are recompiled incrementally by llbuild -- staleness costs time,
      # never correctness.
      #
      # GITHUB_WORKSPACE persists across jobs on the self-hosted box, so the
      # staging paths are wiped before the restore: tar extraction overwrites
      # but never deletes, and a stale staged tree from a prior run must not
      # leak files into this run's restored products.
      - name: Reset staged trusted build products
        run: /bin/rm -rf .mlxfast-cache/trusted-build .mlxfast-cache/worker-build

      - name: Restore trusted build products cache
        id: restore_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/trusted-build
          key: bench-trusted-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Restore worker build products cache
        id: restore_worker_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/worker-build
          key: bench-worker-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Verify restored build products
        env:
          TRUSTED_CACHE_HIT: ${{ steps.restore_build_products_cache.outputs.cache-hit }}
          WORKER_CACHE_HIT: ${{ steps.restore_worker_build_products_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${TRUSTED_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/trusted-build/release
          else
            /bin/rm -rf .mlxfast-cache/trusted-build
          fi
          if [[ "${WORKER_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/worker-build/release
          else
            /bin/rm -rf .mlxfast-cache/worker-build
          fi

      # Copy the dispatched checkout into the bench job root and resolve SwiftPM
      # dependencies THERE while still trusted-and-networked (the bench uid has
      # a PF egress block, so `swift build` under bench must find everything
      # pre-fetched in .build/). Then grant the bench uid inheritable ACL access
      # so the sandboxed build/transform/benchmark phases can work in a tree the
      # runner still owns (runner ownership of the top-level dirs is what lets
      # trusted steps delete hidden material bench wrote inside them).
      - name: Prepare bench workspace
        run: |
          set -euo pipefail
          rm -rf "${MLXFAST_JOB_WS}" || true
          # The workspace path is stable across runs, so a fresh start must be
          # PROVEN, not assumed: bench-owned residue from an interrupted prior
          # job can survive a runner-uid rm -rf. Fail closed to the janitor
          # instead of building on top of another run's leftovers.
          if [[ -e "${MLXFAST_JOB_WS}" || -L "${MLXFAST_JOB_WS}" ]]; then
            echo "::error::stale bench workspace at ${MLXFAST_JOB_WS} could not be fully removed; run the janitor and retry" >&2
            exit 1
          fi
          # APFS clonefile when possible; plain copy fallback starts from a
          # clean slate so a partial clone can never nest.
          cp -c -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}" 2>/dev/null \
            || { rm -rf "${MLXFAST_JOB_WS}"; cp -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"; }
          # The work tree remains trusted-main plus the validated editable-path
          # overlay. Detach only HEAD metadata so score/audit provenance records
          # the candidate SHA, matching the former candidate-branch checkout.
          # git runs through hardened-git.sh so a planted config/hook in the
          # workspace .git cannot execute as the runner uid.
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" cat-file -e "${MLXFAST_CANDIDATE_SHA}^{commit}"
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" update-ref --no-deref HEAD "${MLXFAST_CANDIDATE_SHA}"
          # Seed the build products for both roots (when the caches restored
          # them, the clone above carried them along) so the bench builds only
          # recompile the overlaid editable modules and the link. Same-volume
          # mv is a rename; the restored trees replace the dependency-only
          # roots the SwiftPM source cache may have left. .mlxfast-cache
          # itself stays: the build step still reads
          # .mlxfast-cache/mlx.metallib from it.
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build" "${MLXFAST_JOB_WS}/.build"
            echo "benchmark: seeded trusted build products into bench workspace"
          fi
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build-worker"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build" "${MLXFAST_JOB_WS}/.build-worker"
            echo "benchmark: seeded worker build products into bench workspace"
          fi
          mkdir -p "${MLXFAST_PRIVATE_DIR}"
          chmod 700 "${MLXFAST_PRIVATE_DIR}"
          # Runner-owned so trusted steps can later scrub bench-written hidden
          # files inside it (the semantic answers capture) before timing.
          mkdir -p "${MLXFAST_JOB_WS}/private"
          # Runner-owned, bench-NON-writable staging dir for predictable-name
          # hidden inputs (the raw golden/GPQA reference the attach step
          # installs). Keeping these off the workspace root, in a directory the
          # bench-deny ACL below covers, stops the submitted transform (which
          # holds add_file at the workspace root) from pre-planting a symlink at
          # a predictable name and redirecting the trusted copy that follows.
          mkdir -p "${MLXFAST_JOB_WS}/.ranked-src"
          # Resolve dependencies for both SwiftPM roots while still trusted
          # and networked (the bench uid has a PF egress block).
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions)
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions --scratch-path .build-worker)
          # Functional grant: bench must read/execute the whole tree and write
          # its own build/transform/score outputs. bench OWNS everything it
          # creates (.build, weights, private, score files), so ownership -- not
          # this ACL -- authorizes those writes; the ACL only opens the
          # runner-owned tree for traversal and for creating new entries.
          /bin/chmod -R +a "user:bench allow list,search,readattr,readextattr,read,execute,add_file,add_subdirectory,delete_child,write,append,writeattr,writeextattr,file_inherit,directory_inherit" "${MLXFAST_JOB_WS}"
          # Narrowing (defense in depth): explicitly DENY bench any write/delete
          # on the trusted, runner-owned harness surfaces it only ever reads or
          # executes at run time -- the benchmark driver, the CI scripts, the
          # build tooling, the public fixtures, the editable-surface contract,
          # and the hidden-input staging dir. The directory denies are
          # inheritable so files placed into them later (e.g. the hidden inputs
          # installed into .ranked-src) also become bench-immutable. Deny ACEs
          # are canonically ordered ahead of the allow above, and because these
          # paths are runner-owned bench cannot strip them. This stops a
          # submitted transform from replacing benchmark.sh or a .github/scripts
          # helper between build and a scored run, and from creating/redirecting
          # a predictable-name hidden input. (The built binary and mlx.metallib
          # are bench-owned build outputs that ACLs cannot protect -- their
          # integrity anchor is the trusted-harness content pin verified before
          # each scored run.)
          /bin/chmod -R +a "user:bench deny write,append,writeattr,writeextattr,delete,delete_child,add_file,add_subdirectory,chown,file_inherit,directory_inherit" \
            "${MLXFAST_JOB_WS}/.github" \
            "${MLXFAST_JOB_WS}/tools" \
            "${MLXFAST_JOB_WS}/Sources" \
            "${MLXFAST_JOB_WS}/correctness_prompts" \
            "${MLXFAST_JOB_WS}/.ranked-src"
          /bin/chmod +a "user:bench deny write,append,writeattr,writeextattr,delete,chown" \
            "${MLXFAST_JOB_WS}/benchmark.sh" \
            "${MLXFAST_JOB_WS}/benchmark.json" \
            "${MLXFAST_JOB_WS}/Package.swift" \
            "${MLXFAST_JOB_WS}/Package.resolved"
          echo "benchmark: bench workspace ready at ${MLXFAST_JOB_WS} (trusted harness surfaces ACL-locked against bench writes)"

      # Pin the trusted-harness source scope independently of the
      # participant-controlled package and source manifests: before anything
      # builds, the manifests (Package.swift/Package.resolved) and the source
      # trees feeding the trusted timer/gates/score binary must be
      # byte-identical to the trusted git content, and the trusted contract
      # must not expose them as editable. This does not rely on the overlay
      # or surface-enforcement scripts having been correct -- it re-verifies
      # the actual bytes the trusted build will compile.
      - name: Verify trusted source scope
        run: .github/scripts/verify-trusted-source-scope.sh "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"

      # Verify the bench uid's PF network-egress lockdown BEFORE any submitted
      # code runs (build is the first bench-exec invocation of submission-built
      # code). The runner cannot read pfctl (root only) and sudo permits only
      # bench-exec/janitor, so the property is verified functionally: an
      # outbound TCP connection made AS the bench uid must NOT succeed.
      #
      # CONDITIONAL-UNTIL-LIVE: the PF bench-egress block is designed and
      # staged but not yet enabled on the box (see
      # docs/private-benchmark-security.md "Current posture and known gaps"),
      # so this preflight must not brick every run in the meantime. Decision
      # matrix, in order:
      #   1. Bench-uid probe BLOCKED        -> lockdown live and effective: PASS
      #      (this branch starts verifying automatically the moment the
      #      operator ships the PF block -- no repo change needed).
      #   2. Bench-uid probe OPEN and PF wiring for the bench lockdown is
      #      provisioned in the world-readable PF configuration (/etc/pf.conf
      #      or /etc/pf.anchors/*, matched by operator naming tokens), or the
      #      explicit MLXFAST_REQUIRE_BENCH_EGRESS_LOCKDOWN=1 override is set
      #      -> a provisioned lockdown is NOT effective: FAIL CLOSED.
      #   3. Bench-uid probe OPEN and no lockdown provisioned -> dormant:
      #      WARN and continue (today's documented posture).
      #   4. Probe cannot run (runner itself offline, curl unavailable,
      #      bridge error) -> WARN "cannot assess" and continue; never claim
      #      "verified" on a failed probe. A truly offline box fails closed
      #      minutes later at the hidden-golden download.
      # The runner-uid control probe distinguishes "bench blocked by PF" from
      # "the whole box is offline". The sibling operator change adds the
      # parallel pfctl-level assertion inside measure-job's preflight; this is
      # the repo-side, before-any-submitted-code anchor covering the
      # build/transform/gates phases.
      - name: Assert bench network egress lockdown
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
            set -u
            [ -x /usr/bin/curl ] || exit 2
            rc=1
            for target in https://1.1.1.1 https://8.8.8.8; do
              if /usr/bin/curl --silent --show-error --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
                echo "bench egress reached ${target}"
                rc=0
                break
              fi
            done
            exit "${rc}"
          PROBE
          )"
          # Control probe as the trusted runner uid: if the runner itself has
          # no egress we cannot attribute a blocked bench probe to PF.
          runner_egress=0
          for target in https://1.1.1.1 https://8.8.8.8; do
            if /usr/bin/curl --silent --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
              runner_egress=1
              break
            fi
          done
          if [[ "${runner_egress}" -ne 1 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (trusted-uid egress probe failed; box appears offline); continuing -- trusted network steps will fail closed if the box is truly offline"
            exit 0
          fi
          bench_rc=0
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" /bin/bash -c "${probe}" || bench_rc=$?
          if [[ "${bench_rc}" -eq 1 ]]; then
            echo "benchmark: bench network egress lockdown verified (bench-uid egress blocked)"
            exit 0
          fi
          if [[ "${bench_rc}" -ne 0 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (bench probe exited ${bench_rc}: curl unavailable or bridge error); continuing without a verdict"
            exit 0
          fi
          # bench_rc == 0: bench egress is OPEN. Enforce only if the lockdown
          # is supposed to be live on this box.
          # Provisioning detection reads only world-readable PF configuration
          # (pfctl itself is root-only). Tokens cover the operator naming
          # conventions plus literal PF rule syntax for the bench uid
          # ("user bench" / "user 560"); stock macOS pf.conf/anchors contain
          # none of these, so a vanilla box cannot false-positive into the
          # fail-closed branch.
          pf_provisioned=0
          if grep -Eisq 'mlxfast|darkbloom|bench[-_.]?egress|egress[-_.]?bench|uid[-_.]?560|user[[:space:]]+bench|user[[:space:]]+560([^0-9]|$)' /etc/pf.conf /etc/pf.anchors/* 2>/dev/null; then
            pf_provisioned=1
          fi
          if [[ "${MLXFAST_REQUIRE_BENCH_EGRESS_LOCKDOWN:-0}" == "1" ]]; then
            pf_provisioned=1
          fi
          if [[ "${pf_provisioned}" -eq 1 ]]; then
            echo "::error::bench network egress is NOT locked down (a bench-uid outbound connection succeeded) although the PF bench-egress lockdown is provisioned on this box; refusing to run submitted code" >&2
            exit 1
          fi
          echo "::warning::PF bench-egress lockdown not yet active on this box; egress preflight is dormant (bench-uid egress currently open). It will enforce automatically once the operator ships the PF lockdown."

      # Build through the bridge: compiling the submitted surface is already
      # untrusted-code execution (SwiftPM manifest evaluation, build plugins),
      # so it runs as bench like everything else. Network-free by construction
      # (dependencies pre-resolved above; PF blocks bench egress anyway).
      # The trusted CLI and the participant worker build as two separate
      # bench-exec invocations into two independent SwiftPM roots (.build and
      # .build-worker): the participant-code build never shares a build
      # database, module cache, or products directory with the trusted CLI.
      - name: Build trusted CLI in bench sandbox
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-build
        run: |
          set -euo pipefail
          # The Metal toolchain pin rides the trusted argv into the bridge's
          # env -i child environment (sudo env_reset strips job env, so this
          # explicit /usr/bin/env assignment is the only way it gets there,
          # and nothing submitted code exports can replace it).
          #
          # GIT_CONFIG_*: the janitor recreates the bench user fresh each job,
          # so bench has NO gitconfig, and everything the runner's `swift
          # package resolve` authored in .build/ (checkouts, bare repositories,
          # workspace-state.json) is runner-owned. git >= 2.35.2 refuses to
          # operate on repositories owned by another uid ("detected dubious
          # ownership"), so every git call SwiftPM makes as bench inside the
          # runner-resolved .build fails, SwiftPM concludes the resolved state
          # is unusable, and re-resolves over the network -- which PF correctly
          # blocks for uid 560, wasting ~75 s per parallel fetch batch (~5 min
          # per build) on connect timeouts before SwiftPM's fallback happens to
          # reuse the on-disk repos (incident 2026-07-12). Scoping git's
          # safe.directory trust to exactly this workspace (and its subrepos)
          # for the build lets bench's SwiftPM validate the runner-authored
          # resolve state offline, restoring "network-free by construction".
          # Verified on-box: bench resolve goes from a 5-minute github timeout
          # storm to a 10 s offline no-op; full bench `swift build -c release`
          # completes with ZERO fetches and an unchanged Package.resolved.
          # This is a git-trust knob only -- filesystem ACLs (including the
          # bench deny ACEs on trusted surfaces) are untouched, and bench
          # gains no access it did not already have.
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --product mlxfast-swift
            '
          test -x "${MLXFAST_JOB_WS}/.build/release/mlxfast-swift"
          # Pin the trusted timer/gates/score artifacts NOW, before the
          # participant worker build runs: worker-build-time code execution
          # (manifest evaluation, build plugins) happens as bench and must
          # not be able to alter the trusted binary between its build and
          # its pin. Every later phase that executes the driver/binary as
          # bench re-verifies against this pin and fails closed on any
          # change (TOCTOU defense).
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted

      # Same bridge/env contract as the trusted CLI build above; this
      # invocation compiles the participant-editable surface (MLXFastModel and
      # the vendored MLX forks) into the worker's own .build-worker root and
      # produces the participant mlx.metallib next to the worker binary.
      - name: Build participant worker in bench sandbox
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-buildworker
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --scratch-path .build-worker --product mlxfast-runtime-worker
              if [[ -s .mlxfast-cache/mlx.metallib && -s .mlxfast-cache/mlx.metallib.fingerprint ]]; then
                /bin/cp .mlxfast-cache/mlx.metallib .build-worker/release/mlx.metallib
                /bin/cp .mlxfast-cache/mlx.metallib.fingerprint .build-worker/release/mlx.metallib.fingerprint
                echo "benchmark: restored trusted MLX Metal library"
              else
                tools/build-mlx-metallib.sh
              fi
              /bin/chmod 0644 .build-worker/release/mlx.metallib .build-worker/release/mlx.metallib.fingerprint
            '
          test -x "${MLXFAST_JOB_WS}/.build-worker/release/mlxfast-runtime-worker"
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib"
          # The trusted CLI re-verifies this record against the vendored
          # sources before every worker spawn; assert it was produced.
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib.fingerprint"
          # Separate participant-worker attestation, captured at the end of
          # the worker build and before the submitted transform (the first
          # bench step that could tamper with the workspace): every scored
          # phase must execute exactly the worker binary and metallib built
          # from the reviewed source tree. The worker stays OUT of the
          # trusted pin -- it is participant code with its own attestation.
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      - name: Stage trusted MLX Metal library cache
        if: steps.restore_mlx_metallib_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p .mlxfast-cache
          /bin/cp "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib" .mlxfast-cache/mlx.metallib
          /bin/cp "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib.fingerprint" .mlxfast-cache/mlx.metallib.fingerprint

      - name: Save trusted MLX Metal library cache
        if: steps.restore_mlx_metallib_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mlxfast-cache/mlx.metallib
            .mlxfast-cache/mlx.metallib.fingerprint
          key: mlx-metallib-m5-max-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.sha256 }}

      # Main-ref dispatches only (same gate and same reasoning as the metallib
      # save above): on main there is no submitted overlay, so the staged
      # build trees derive purely from trusted sources. Submission runs can
      # execute submitted code as bench inside both roots, but they can never
      # save. Clang module caches are excluded: clang creates them mode-700
      # under the bench uid (unreadable to the runner-uid copy), and they are
      # transient compiler caches the next build recreates cheaply.
      - name: Stage trusted build products cache
        if: steps.restore_build_products_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          /bin/rm -rf .mlxfast-cache/trusted-build
          /bin/mkdir -p .mlxfast-cache/trusted-build
          /usr/bin/rsync -a \
            --exclude='ModuleCache' \
            --exclude='clang-module-cache' \
            "${MLXFAST_JOB_WS}/.build/" .mlxfast-cache/trusted-build/
          test -d .mlxfast-cache/trusted-build/release

      - name: Save trusted build products cache
        if: steps.restore_build_products_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/trusted-build
          key: bench-trusted-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Stage worker build products cache
        if: steps.restore_worker_build_products_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          /bin/rm -rf .mlxfast-cache/worker-build
          /bin/mkdir -p .mlxfast-cache/worker-build
          /usr/bin/rsync -a \
            --exclude='ModuleCache' \
            --exclude='clang-module-cache' \
            "${MLXFAST_JOB_WS}/.build-worker/" .mlxfast-cache/worker-build/
          test -d .mlxfast-cache/worker-build/release

      - name: Save worker build products cache
        if: steps.restore_worker_build_products_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/worker-build
          key: bench-worker-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Transform reference checkpoint in bench sandbox
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-transform
        run: |
          set -euo pipefail
          # The old pipeline wrapped transform in run-offline.sh (a sandbox-exec
          # network deny). Here the bench uid's PF egress block plus workspace
          # write confinement provide the same guarantees at the uid layer, and
          # the reference cache is read-only to bench (runner-owned).
          # MLXFAST_SANDBOX_PARENT_TOOLS=1 arms the CLI's parent-tool Seatbelt
          # sandbox: transform runs the submission-built binary directly (no
          # runtime worker), so it self-confines (deny network/fork/exec/DNS
          # mach-lookup) before reading the reference or writing weights. Any
          # missing sandbox-exec fails the run closed.
          status=0
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "benchmark: running submitted transform with private process logs suppressed"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_REFERENCE_DIR="${MLXFAST_REFERENCE_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_REFERENCE_DIR}" \
                  --output weights
              ' > "${MLXFAST_PRIVATE_DIR}/transform-private.log" 2>&1 || status=$?
          else
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_REFERENCE_DIR="${MLXFAST_REFERENCE_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_REFERENCE_DIR}" \
                  --output weights
              ' || status=$?
          fi
          test "${status}" -eq 0
          test -f "${MLXFAST_JOB_WS}/weights/config.json"

      # Hash the immutable transform output before any model invocation can
      # mutate the workspace. This is ranked-audit provenance only; public
      # correctness dispatches skip the full-model read.
      - name: Hash transformed weights for ranked audit
        if: ${{ inputs.run_benchmark }}
        run: .github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/weights" weights.sha256

      # TOCTOU guard: the submitted transform just ran with workspace write
      # access. Re-verify that the trusted driver + binary and the participant
      # worker + metallib still match their post-build pins before executing
      # them as bench again.
      - name: Verify trusted harness before public gate
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # Public drift tripwire (issue #83 class): one independent 64-step
      # teacher-forced check against the checked-in public fixture, run BEFORE
      # the hidden gates so honest numeric drift fails fast. A tripwire for
      # accidental behavior change, NOT a security boundary -- the hidden gates
      # and the static review remain the adversarial defenses. Deliberately
      # ordered BEFORE the hidden golden ever enters the bench workspace, so
      # the worker running this public case cannot read any hidden bytes.
      # In correctness-only dispatches (run_benchmark=false) this is also the
      # produced correctness verdict, replacing the old correctness-only job.
      - name: Public behavior gate
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-publicgate
          # Harness parity: the worker Seatbelt profile denies the golden under
          # check, exactly like writeRuntimeWorkerSandboxProfile does on the VM
          # pipeline. env_keep carries this through sudo to bench-exec.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/correctness_prompts/public_longcopy_gate_english_512_256.json
        run: |
          set -euo pipefail
          actual_hash="$(shasum -a 256 "${MLXFAST_JOB_WS}/${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256}" ]]; then
            echo "::error::public correctness golden hash mismatch (${actual_hash})" >&2
            exit 1
          fi
          status=0
          started="${SECONDS}"
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "benchmark: running public behavior gate with process logs suppressed"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
                MLXFAST_PUBLIC_GOLDEN="${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                exec .build/release/mlxfast-swift correctness \
                  --weights weights \
                  --golden "${MLXFAST_PUBLIC_GOLDEN}"
              ' > public-gate-report.json \
                2> "${MLXFAST_PRIVATE_DIR}/public-gate-private.log" || status=$?
          else
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
                MLXFAST_PUBLIC_GOLDEN="${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                exec .build/release/mlxfast-swift correctness \
                  --weights weights \
                  --golden "${MLXFAST_PUBLIC_GOLDEN}"
              ' > public-gate-report.json || status=$?
          fi
          # The report only ever references the checked-in public fixture, so
          # surfacing the mismatch position and tokens leaks nothing hidden.
          jq -r '"benchmark: public gate passed=\(.passed) checked_steps=\(.checked_steps) first_failing_step=\(.first_failing_step) expected_token=\(.expected_token) actual_token=\(.actual_token)"' \
            public-gate-report.json || true
          echo "benchmark: public behavior gate finished in $((SECONDS - started))s"
          exit "${status}"

      # ---- correctness-only (run_benchmark=false) artifact path -------------
      - name: Validate correctness artifacts
        id: validate_correctness_artifacts
        if: ${{ always() && !inputs.run_benchmark }}
        run: |
          set -euo pipefail
          test -s public-gate-report.json
          # Pin the checked-in fixture, then derive expected case/step coverage
          # from it, like the old correctness-only job did.
          actual_hash="$(shasum -a 256 "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" | tr -d ' ')"
          test "${actual_hash}" == "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256}"
          test "${actual_bytes}" == "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_BYTES}"
          coverage="$(jq -r --argjson base "${MLXFAST_EXPECTED_CORRECTNESS_STEPS}" \
            '((.cases | length) * $base) as $steps | "\(.cases | length) \($steps)"' \
            "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}")"
          expected_cases="${coverage%% *}"
          expected_steps="${coverage##* }"
          jq -e \
            --arg golden_hash "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256}" \
            --argjson checked_steps "${expected_steps}" \
            --argjson correctness_cases "${expected_cases}" \
            '
            .passed == true
            and .checked_steps == $checked_steps
            and .case_count == $correctness_cases
            and .golden_hash == $golden_hash
            and .error == ""
            and .first_failing_case == null
            and .first_failing_step == null
            and .expected_token == null
            and .actual_token == null
            ' \
            public-gate-report.json >/dev/null
          printf '%s  correctness_golden.json\n' "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256}" > public-golden.sha256
          printf '%s  correctness_golden.json\n' "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_BYTES}" > public-golden.bytes

      - name: Stage correctness artifacts
        id: stage_correctness_artifacts
        if: ${{ always() && !inputs.run_benchmark && (!startsWith(github.ref, 'refs/heads/submissions/') || steps.validate_correctness_artifacts.outcome == 'success') }}
        run: |
          set -euo pipefail
          test "$(cat candidate.sha)" = "${MLXFAST_CANDIDATE_SHA}"
          .github/scripts/deny-private-artifacts.sh \
            candidate.sha \
            public-gate-report.json \
            public-golden.sha256 \
            public-golden.bytes
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/correctness-results" \
            candidate.sha=candidate.sha \
            correctness-report.json=public-gate-report.json \
            golden.sha256=public-golden.sha256 \
            golden.bytes=public-golden.bytes

      - name: Upload correctness artifacts
        if: always() && steps.stage_correctness_artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: correctness-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/correctness-results
          if-no-files-found: error
          overwrite: true

      # ---- ranked path (run_benchmark=true) ---------------------------------
      # Reap any bench-uid process that leaked out of the unsandboxed build/
      # transform steps BEFORE hidden material enters the workspace, so a daemon
      # spawned earlier cannot linger to read the golden/GPQA reference during
      # the gates phase. Runs through the bench-exec bridge (as the bench uid,
      # the only context that can signal its own uid's stragglers); the reaper
      # spares its own process tree.
      - name: Reap lingering bench processes before hidden material
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      # Record every file in the bench workspace BEFORE any hidden material
      # enters it. The allowlist scrub before timing restores the workspace to
      # this pre-hidden state, deleting anything written while hidden tokens were
      # present (the gates phase) -- closing the "saw hidden tokens -> a file
      # survives into the timed measurement" bridge. Runner-owned, so the bench
      # uid cannot tamper with the manifest.
      #
      # The bench-owned TMPDIR scratch (${MLXFAST_JOB_WS}/tmp, provisioned by
      # the bridge) is purged THROUGH the bridge first: the runner uid cannot
      # unlink inside a bench-owned directory, so leaving scratch behind would
      # either park bench-written bytes where the timed phase could read them
      # or force the scrub to fail on files it cannot delete. Purging as bench
      # (which owns the scratch; same pattern as the end-of-job cleanup)
      # removes the residual instead of allowlisting it. The remaining
      # tolerated find skips are bench-private 0700 module caches inside
      # .build/ -- an allowlisted path the scrub never walks, kept consistent
      # by construction; any find error other than Permission denied fails
      # the snapshot closed.
      - name: Snapshot post-transform workspace
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          find_err="${MLXFAST_PRIVATE_DIR}/post-transform-find.err"
          set +e
          ( cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 2> "${find_err}" ) \
            | LC_ALL=C sort -z > "${manifest}"
          set -e
          if [[ -s "${find_err}" ]]; then
            if grep -vq 'Permission denied' "${find_err}"; then
              echo "::error::workspace snapshot hit unexpected find errors (only bench-private Permission denied subtrees are tolerated):" >&2
              cat "${find_err}" >&2
              exit 1
            fi
            skipped="$(grep -c 'Permission denied' "${find_err}" | tr -d ' ')"
            echo "benchmark: snapshot skipped ${skipped} bench-private (0700) subtrees the runner cannot read; the scrub is equally blind there and end-of-job cleanup wipes them"
          fi
          test -s "${manifest}"
          count="$(tr -cd '\0' < "${manifest}" | wc -c | tr -d ' ')"
          echo "benchmark: snapshotted ${count} pre-hidden workspace files for the allowlist scrub"

      # Trusted steps fetch and pin the hidden artifacts. Raw bytes live only
      # under the runner-private dir; the bench uid never reads the R2 secrets
      # or the raw GPQA reference (its accepted answers reach the bench parent
      # only inside the augmented golden, exactly as on the VM pipeline, where
      # the harness parent process read the augmented golden too).
      - name: Prepare hidden correctness golden
        if: ${{ inputs.run_benchmark }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Private object keys scoped to this trusted download step only (not
          # job-level), so untrusted bench phases never receive the object names.
          MLXFAST_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/golden_prompt_benchmark_transcription_gate_english_512_256-laguna.json
          MLXFAST_GPQA_R2_PATH: correctness_prompts/gpqa_reference_cases-laguna.json
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/raw_golden.json"
          raw_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | awk '{print $1}')"
          raw_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | tr -d ' ')"
          if [[ "${raw_hash}" != "${MLXFAST_RAW_CORRECTNESS_GOLDEN_SHA256}" || "${raw_bytes}" != "${MLXFAST_RAW_CORRECTNESS_GOLDEN_BYTES}" ]]; then
            echo "::error::raw hidden correctness golden pin mismatch" >&2
            exit 1
          fi
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_GPQA_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json"
          echo "benchmark: raw hidden golden verified ${raw_hash} bytes=${raw_bytes}"

      # PARITY CONTRACT: attach-gpqa-gates augments the raw golden with GPQA
      # behavior gates but MUST NOT mutate its .cases (the base teacher-forced
      # case) -- enforced directly below by re-pinning the augmented golden's
      # .cases against the raw hash-pinned golden, with
      # verify-correctness-golden.sh's coverage arithmetic plus the final
      # checked_steps validation as backstops. attach-gpqa-gates loads the tokenizer, i.e.
      # runs code from the submitted build, so it executes through bench-exec
      # like every other untrusted invocation (the VM pipeline ran it as the
      # workflow user; the bench uid is strictly less privileged). The raw
      # inputs are copied in as runner-owned files and scrubbed immediately
      # after, so during any later worker-spawning phase the only hidden file
      # in the workspace is the augmented golden, which the worker Seatbelt
      # profile denies by literal path (BENCH_GOLDEN_PATH below).
      - name: Attach GPQA gates and verify augmented golden
        if: ${{ inputs.run_benchmark }}
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-attach
        run: |
          set -euo pipefail
          # Symlink-safe placement of the predictable-name hidden inputs. They
          # go into the runner-owned, bench-NON-writable .ranked-src/ staging
          # dir (ACL-denied to bench in "Prepare bench workspace"), so the
          # submitted transform can no longer pre-plant a symlink at these names
          # and redirect the trusted copy to leak the raw hidden golden. The
          # explicit reject-if-exists/symlink guard plus install(1) (which
          # creates a fresh regular file, never writes through a symlink) are
          # belt-and-suspenders on top of the ACL.
          golden_src="${MLXFAST_JOB_WS}/.ranked-src/golden.json"
          gpqa_src="${MLXFAST_JOB_WS}/.ranked-src/gpqa.json"
          for hidden_target in "${golden_src}" "${gpqa_src}"; do
            if [[ -e "${hidden_target}" || -L "${hidden_target}" ]]; then
              echo "::error::refusing to place hidden input over pre-existing path ${hidden_target}" >&2
              exit 1
            fi
          done
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/raw_golden.json" "${golden_src}"
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json" "${gpqa_src}"
          status=0
          # MLXFAST_SANDBOX_PARENT_TOOLS=1 arms the CLI's parent-tool Seatbelt
          # sandbox: attach-gpqa-gates runs the submission-built binary directly
          # to read the raw hidden golden + GPQA answer key, so it self-confines
          # (deny network/fork/exec/DNS mach-lookup) before opening those inputs.
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_GPQA_CASE_COUNT="${MLXFAST_GPQA_CASE_COUNT}" \
              MLXFAST_GPQA_MAX_NEW_TOKENS="${MLXFAST_GPQA_MAX_NEW_TOKENS}" \
              MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
              set -u
              cd "${MJOB_WS}" || exit 97
              exec .build/release/mlxfast-swift attach-gpqa-gates \
                --golden .ranked-src/golden.json \
                --gpqa .ranked-src/gpqa.json \
                --tokenizer weights \
                --output correctness_golden_ranked.json \
                --case-count "${MLXFAST_GPQA_CASE_COUNT}" \
                --max-new-tokens "${MLXFAST_GPQA_MAX_NEW_TOKENS}"
            ' > "${MLXFAST_PRIVATE_DIR}/attach-gpqa.log" 2>&1 || status=$?
          # Runner-owned files: this unlinks the real trusted inputs, never an
          # attacker symlink (bench could not have created one here).
          rm -rf "${MLXFAST_JOB_WS}/.ranked-src"
          test "${status}" -eq 0 || { echo "::error::attach-gpqa-gates failed" >&2; exit 1; }
          test -s "${MLXFAST_JOB_WS}/correctness_golden_ranked.json"
          # Trusted copy is the pinned instance the artifacts reference; the
          # workspace copy is what the (bench) harness parent reads at run time.
          cp "${MLXFAST_JOB_WS}/correctness_golden_ranked.json" "${MLXFAST_CORRECTNESS_GOLDEN_PATH}"
          # Defense in depth: attach-gpqa-gates executes the SUBMITTED build,
          # so never trust its output to preserve the base case. Re-pin the
          # augmented golden's .cases against the raw hash-pinned golden
          # (canonicalized with jq -S, since augmentation re-encodes key order
          # and whitespace): augmentation may only append behavior gates,
          # never mutate the teacher-forced base .cases.
          raw_cases_hash="$(jq -S '.cases' "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | shasum -a 256 | awk '{print $1}')"
          augmented_cases_hash="$(jq -S '.cases' "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | shasum -a 256 | awk '{print $1}')"
          if [[ "${augmented_cases_hash}" != "${raw_cases_hash}" ]]; then
            echo "::error::attach-gpqa-gates mutated the pinned base .cases (augmented ${augmented_cases_hash} != raw ${raw_cases_hash})" >&2
            exit 1
          fi
          echo "benchmark: augmented golden base cases re-pinned to raw pinned golden (cases sha256 ${raw_cases_hash})"
          actual_hash="$(shasum -a 256 "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | tr -d ' ')"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256="${actual_hash}"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES="${actual_bytes}"
          {
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256=${actual_hash}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES=${actual_bytes}"
          } >> "${GITHUB_ENV}"
          # Writes the golden.sha256/.bytes sidecars and exports the expected
          # case/step coverage (MLXFAST_EXPECTED_CORRECTNESS_{CASES,CHECKED_STEPS})
          # into GITHUB_ENV for the final artifact validation.
          .github/scripts/verify-correctness-golden.sh
          # Guard the augmented workspace copy against divergence from the
          # verified trusted copy (they must be byte-identical).
          ws_hash="$(shasum -a 256 "${MLXFAST_JOB_WS}/correctness_golden_ranked.json" | awk '{print $1}')"
          test "${ws_hash}" == "${actual_hash}"
          echo "benchmark: using private GPQA-augmented correctness golden ${actual_hash} bytes=${actual_bytes}"

      # TOCTOU guard before the first --official invocation: attach-gpqa-gates
      # and the public gate executed the binaries as bench since the last
      # check, so re-verify the trusted driver + binary and the participant
      # worker + metallib against their post-build pins. A replaced
      # benchmark.sh or binary here could otherwise forge the sealed gates
      # score.
      - name: Verify trusted harness before gates
        if: ${{ inputs.run_benchmark }}
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # The single gates+base pass: ONE `mlxfast-swift benchmark` invocation
      # (via benchmark.sh --official) that teacher-forces the FULL 64-step
      # hidden base case (unsliced -- the 3-way slicing existed only for
      # parallel wall-clock speed; teacher forcing makes the verdict identical
      # run whole or sliced) AND runs the anchor/free-run/behavior/GPQA gates,
      # GPQA TTFT, and the semantic-answer capture, while SKIPPING the timed
      # benchmark (MLXFAST_BENCHMARK_SKIP_TIMED=1). passed_correctness and
      # correctness_seconds natively cover base + gates in one invocation.
      # The timed measurement deliberately does NOT happen here -- it runs LAST,
      # behind measure-job's fixed 40C thermal gate (see header).
      - name: Correctness and gates (full base case + hidden gates, no timing)
        id: gates_run
        if: ${{ inputs.run_benchmark }}
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-gates
          # Worker Seatbelt literal deny for the augmented hidden golden. Only
          # the harness PARENT (trusted control flow) may read it to drive
          # teacher forcing; the worker that executes submitted model code
          # cannot. Kept through sudo env_reset via the sudoers env_keep list.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/correctness_golden_ranked.json
          MLXFAST_NOTE: "ci ${{ github.event_name }} ${{ env.MLXFAST_CANDIDATE_SHA }} mode=single-machine-gates"
        run: |
          set -euo pipefail
          # Known, documented residual: the semantic-answer capture (which
          # embeds hidden reference answers) is written by the harness parent
          # into ${MLXFAST_JOB_WS}/private/ at the very END of this pass, after
          # every behavior verdict is already recorded; the bench-exec worker
          # template cannot subpath-deny it like the VM harness profile did.
          # The exposure window is the few seconds between that write and
          # worker teardown, gains nothing (all gate verdicts are final by
          # then), and the file is scrubbed by a trusted step before any later
          # phase spawns another worker.
          raw_stdout="${MLXFAST_PRIVATE_DIR}/gates-stdout.raw"
          gates_log="${MLXFAST_PRIVATE_DIR}/gates-private.log"
          started="${SECONDS}"
          status=0
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env \
              MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_OFFICIAL_BENCHMARK_RUN=1 \
              MLXFAST_SKIP_TRANSFORM=1 \
              MLXFAST_VERIFY_TRANSFORM="${MLXFAST_VERIFY_TRANSFORM}" \
              MLXFAST_REFERENCE_DIR="${MLXFAST_REFERENCE_DIR}" \
              MLXFAST_WEIGHTS_PATH=weights \
              MLXFAST_CORRECTNESS_GOLDEN_PATH=correctness_golden_ranked.json \
              MLXFAST_BENCHMARK_CORRECTNESS_STEPS="${MLXFAST_EXPECTED_CORRECTNESS_STEPS}" \
              MLXFAST_BENCHMARK_CHECK_GATES=1 \
              MLXFAST_BENCHMARK_SKIP_TIMED=1 \
              MLXFAST_PRIVATE_DIR="${MLXFAST_JOB_WS}/private" \
              MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH="${MLXFAST_JOB_WS}/private/semantic_gpqa_answers.json" \
              MLXFAST_SEMANTIC_GPQA_CASE_COUNT="${MLXFAST_SEMANTIC_GPQA_CASE_COUNT}" \
              MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS="${MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS}" \
              MLXFAST_SCORE_PATH=score.gates.json \
              MLXFAST_INTEGRITY_PATH=benchmark-integrity.gates.json \
              MLXFAST_NOTE="${MLXFAST_NOTE}" \
              MLXFAST_COMMIT_SHA="${MLXFAST_CANDIDATE_SHA}" \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0='*' \
              /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                ./benchmark.sh --official 1>&2
                status=$?
                if [ -s "${MLXFAST_SCORE_PATH}" ]; then
                  cat "${MLXFAST_SCORE_PATH}"
                fi
                exit "${status}"
              ' > "${raw_stdout}" 2> "${gates_log}" &
          pid="$!"
          # ps -p, not kill -0: the backgrounded pid is a setuid sudo process,
          # so the runner user cannot signal it (kill -0 would EPERM and end
          # the heartbeat immediately) but can still see it in the process
          # table.
          while ps -p "${pid}" >/dev/null 2>&1; do
            sleep 60
            if ps -p "${pid}" >/dev/null 2>&1; then
              echo "benchmark: correctness+gates still running elapsed=$((SECONDS - started))s"
            fi
          done
          wait "${pid}" || status=$?
          # Submitted-process stderr stays private on submission branches; on
          # trusted branches replay it for operators (public content only in
          # the sense the old pipeline streamed it too).
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" != "1" ]]; then
            cat "${gates_log}" || true
          fi
          # SCORE SEALING (mirrors measure-job.sh and benchmark.sh): the score
          # payload is taken from the exec'd process's stdout, captured in THIS
          # trusted shell -- exactly one JSON object shaped like a score.
          # On-disk workspace files are untrusted after bench ran; the sealed
          # copy plus the integrity hash cross-check below discard any tamper.
          if [[ "$(jq -s 'length' "${raw_stdout}" 2>/dev/null)" != "1" ]] \
              || ! jq -e '(.passed | type == "boolean") and has("score") and (.metrics | type == "object")' \
                  "${raw_stdout}" >/dev/null 2>&1; then
            echo "::error::correctness+gates run did not emit a single valid score payload (exit=${status})" >&2
            exit 1
          fi
          cp "${raw_stdout}" score.json
          cp "${MLXFAST_JOB_WS}/benchmark-integrity.gates.json" benchmark-integrity.json
          sealed_hash="$(shasum -a 256 score.json | awk '{print $1}')"
          integrity_hash="$(jq -r '.score_sha256 // empty' benchmark-integrity.json)"
          if [[ "${sealed_hash}" != "${integrity_hash}" ]]; then
            echo "::error::sealed gates score hash does not match harness integrity record (possible in-workspace tamper)" >&2
            exit 1
          fi
          trusted_weights_hash="$(tr -d '[:space:]' < weights.sha256)"
          gates_weights_hash="$(jq -r '.metrics.weights_hash // empty' score.json)"
          integrity_weights_hash="$(jq -r '.weights_sha256 // empty' benchmark-integrity.json)"
          if [[ "${gates_weights_hash}" != "${trusted_weights_hash}" \
              || "${integrity_weights_hash}" != "${trusted_weights_hash}" ]]; then
            echo "::error::transformed weights changed between trusted hashing and the gates run" >&2
            exit 1
          fi
          echo "benchmark: correctness+gates finished exit=${status} seconds=$((SECONDS - started))"
          exit "${status}"

      # Mirrors the old "Validate intermediate benchmark artifact" gate: on a
      # real gates failure the score's error/token fields can carry hidden
      # values, so nothing downstream may consume an unvalidated score. Leak
      # fields only; the full business-field validation happens after the
      # timing overlay.
      - name: Validate sealed gates score
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          test -s score.json
          jq -e '
            .passed == true
            and (.metrics.error == "")
            and (.metrics.first_failing_case == null)
            and (.metrics.first_failing_layer == null)
            and (.metrics.first_failing_step == null)
            and (.metrics.expected_token == null)
            and (.metrics.actual_token == null)
            and (.metrics.passed_correctness == true)
          ' score.json >/dev/null

      # Semantic GPQA judge (Anthropic), trusted step: consumes the bench-
      # written answer capture, patches the sealed score's semantic fields and
      # overall verdict, and re-anchors the integrity hash. The API key never
      # crosses the bridge.
      - name: Semantic GPQA gate
        if: ${{ inputs.run_benchmark }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH: ${{ env.MLXFAST_JOB_WS }}/private/semantic_gpqa_answers.json
          MLXFAST_SCORE_PATH: score.json
          MLXFAST_INTEGRITY_PATH: benchmark-integrity.json
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          .github/scripts/run-semantic-gpqa-gate.sh

      # Restore the bench workspace to its pre-correctness-hidden snapshot
      # BEFORE the timed phase spawns new workers. This is an ALLOWLIST scrub,
      # not the old golden-name denylist: the augmented golden and the
      # semantic-answer capture are removed explicitly, weights/ is re-verified
      # against its pinned hash, and EVERY other file present now but absent
      # from the post-transform snapshot (i.e. written while hidden correctness
      # tokens were in the gates phase) is deleted -- so an arbitrary
      # bench-written file cannot bridge "saw hidden correctness tokens" into
      # "controls the published timing". The separate private timed prompt is
      # downloaded only after this scrub and is handed directly to the trusted
      # measurement wrapper. Only the caches the timed phase legitimately keeps
      # or regenerates are preserved: weights/ (hash-verified below), .build/
      # and .build-worker/ (their binaries + metallib are separately
      # pin-verified), the self-generated benchmark oracle, and the checked-in
      # public fixtures. All top-level paths sit in runner-owned directories,
      # so the trusted shell can unlink bench-written files; a straggler it
      # cannot remove fails the run closed.
      - name: Scrub hidden material from bench workspace
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          rm -f "${MLXFAST_JOB_WS}/correctness_golden_ranked.json"
          rm -rf "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/private"
          # Purge the bench-owned TMPDIR scratch THROUGH the bridge (the
          # runner uid cannot unlink inside bench-owned dirs, and 0700
          # scratch subdirs written during gates stay readable to the
          # same-uid timed workers -- a gates->timed bridge the manifest
          # diff cannot see). Same pattern as the snapshot step and the
          # end-of-job cleanup.
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          test -s "${manifest}"
          scrub_failed=0
          while IFS= read -r -d '' rel; do
            case "${rel}" in
              ./weights/*|./.build/*|./.build-worker/*|./correctness_prompts/*) continue ;;
              ./bench_oracle*|./private/*) continue ;;
            esac
            if grep -zqxF -- "${rel}" "${manifest}"; then
              continue
            fi
            target="${MLXFAST_JOB_WS}/${rel#./}"
            rm -f -- "${target}" 2>/dev/null || true
            if [[ -e "${target}" || -L "${target}" ]]; then
              echo "::error::allowlist scrub could not remove gates-phase workspace file: ${rel}" >&2
              scrub_failed=1
            fi
          done < <(cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 | LC_ALL=C sort -z)
          if [[ "${scrub_failed}" -ne 0 ]]; then
            echo "::error::allowlist scrub left gates-phase workspace files it could not delete" >&2
            exit 1
          fi
          # Re-verify weights/ against the hash pinned right after transform, so
          # the timed phase runs on exactly the transform output (any new file or
          # mutation inside weights/ changes the hash and fails closed here).
          test -s weights.sha256
          scrub_weights_hash="$(.github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/weights")"
          trusted_weights_hash="$(tr -d '[:space:]' < weights.sha256)"
          if [[ "${scrub_weights_hash}" != "${trusted_weights_hash}" ]]; then
            echo "::error::transformed weights changed before timing (hash ${scrub_weights_hash} != ${trusted_weights_hash})" >&2
            exit 1
          fi
          # Backstop the former golden-name denylist as a second line of defense.
          leftovers="$(find "${MLXFAST_JOB_WS}" -maxdepth 1 -name '*golden*' ! -name 'bench_oracle*' ! -path "*/correctness_prompts/*" | grep -v '^$' || true)"
          if [[ -n "${leftovers}" ]]; then
            echo "::error::hidden-material scrub left candidates behind: ${leftovers}" >&2
            exit 1
          fi
          echo "benchmark: bench workspace restored to pre-hidden snapshot before timing"

      # Reap any bench-uid process that lingered from the gates phase before the
      # timed measurement begins, so no daemon spawned while hidden material was
      # present can bridge state into (or perturb) the scored timing. Through the
      # bench-exec bridge, sparing this reaper's own tree.
      - name: Reap lingering bench processes before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      # The timed prompt is independent of every correctness/QA fixture. Keep
      # its object key scoped to this trusted download step and its bytes under
      # the runner-only private directory; measure-job receives the explicit
      # path and generates each binary's checked oracle from this target.
      - name: Prepare hidden timed decode prompt
        if: ${{ inputs.run_benchmark }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MLXFAST_TIMED_DECODE_PROMPT_R2_PATH: correctness_prompts/timed_decode_gc_runtimes_essay-laguna.txt
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_TIMED_DECODE_PROMPT_R2_PATH}" \
            "${MLXFAST_TIMED_DECODE_PROMPT_PATH}"
          actual_hash="$(shasum -a 256 "${MLXFAST_TIMED_DECODE_PROMPT_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_TIMED_DECODE_PROMPT_PATH}" | tr -d ' ')"
          if [[ "${actual_hash}" != "${MLXFAST_TIMED_DECODE_PROMPT_SHA256}" \
              || "${actual_bytes}" != "${MLXFAST_TIMED_DECODE_PROMPT_BYTES}" ]]; then
            echo "::error::hidden timed decode prompt pin mismatch" >&2
            exit 1
          fi
          echo "benchmark: hidden timed decode target verified id=${MLXFAST_TIMED_DECODE_TARGET_ID} sha256=${actual_hash} bytes=${actual_bytes}"

      # The compute-heavy pass above leaves CPU load and scheduler churn behind
      # for a minute or two. measure-job's preflight fails closed on load >=
      # 2.0 or GPU util >= 10%, so wait for quiescence here instead of burning
      # its one gated retry. (GPU HEAT is handled separately and non-negotiably
      # by measure-job's fixed 40C thermal gate.)
      - name: Wait for quiescence before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          waited=0
          while :; do
            load="$(sysctl -n vm.loadavg | awk '{print $2}')"
            util="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.gpu_usage[1] // 1' || true)"
            # A dropped telemetry sample must not abort the wait; treat it as
            # "still busy" and retry.
            [[ -n "${util}" ]] || util=1
            if [[ "$(echo "${load} < 2.0" | bc -l)" == "1" && "$(echo "${util} < 0.10" | bc -l)" == "1" ]]; then
              break
            fi
            sleep 15
            waited=$((waited + 15))
            if [[ "${waited}" -ge 900 ]]; then
              echo "::error::machine did not reach quiescence within 900s (load=${load} gpu_util=${util})" >&2
              exit 1
            fi
          done
          temp="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.temp.gpu_temp_avg // "?"')"
          echo "benchmark: quiescent after ${waited}s (load=${load} gpu_util=${util} gpu_temp=${temp}C); thermal gate is enforced inside measure-job"

      # TOCTOU guard before the second --official invocation: the gates pass
      # executed submitted model code since the last check, so re-verify the
      # trusted driver + binary and the participant worker + metallib against
      # their post-build pins before measure-job re-runs ./benchmark.sh and
      # the binaries for the scored timing. measure-job is box-owned and
      # cannot be modified from the repo, so this trusted-shell check right
      # before it is the repo-side integrity anchor for the timed phase.
      - name: Verify trusted harness before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # THE TIMED MEASUREMENT -- LAST, via the validated clean path. measure-job
      # (trusted, runner-owned, fixed thermal contract) runs, in order: pinned
      # BASELINE tree then CANDIDATE workspace, each as `./benchmark.sh
      # --official` through bench-exec with a per-binary self-generated oracle
      # derived from the explicit private --prompt target, each behind the 40C
      # gate with 2 Hz telemetry, throttle/telemetry/token acceptance and one
      # gated retry, a baseline calibration-band check, and a sealed results.json
      # with the paired ratio. Baseline-first mirrors the old pipeline's
      # "measure the pinned reference minutes before the candidate". Changing
      # the timed target, pinned baseline tree, or its calibration is a
      # ranking-contract change (see RUNBOOK).
      - name: Timed paired benchmark (measure-job)
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          # GPU_LOADED_UTIL=0.95 (documented measure-job tunable): the M5 GPU's
          # first loaded telemetry sample is a spin-up transient (~1590 MHz at
          # 93-94% util, coolest sample of the run) that false-trips the fixed
          # MIN_FREQ=1600 throttle-reject; 0.95 classifies only steady-state
          # samples (0.96-0.98 util at 1607-1610 MHz) as loaded. The fixed
          # thermal contract (40C gate, 900s ceiling, 1600 MHz floor) is
          # readonly inside measure-job and remains fully enforced.
          MEASURE_STATE_DIR="${MLXFAST_MEASURE_STATE_DIR}" \
          BASELINE_WS="${MLXFAST_BASELINE_WS}" \
          BASELINE_CALIBRATION="${MLXFAST_BASELINE_CALIBRATION}" \
          GPU_LOADED_UTIL=0.95 \
            "${MLXFAST_MEASURE_JOB}" \
              --candidate "${MLXFAST_JOB_WS}" \
              --baseline "${MLXFAST_BASELINE_WS}" \
              --prompt "${MLXFAST_TIMED_DECODE_PROMPT_PATH}" \
              --prompt-sha256 "${MLXFAST_TIMED_DECODE_PROMPT_SHA256}" \
              --target-id "${MLXFAST_TIMED_DECODE_TARGET_ID}" \
              --tag "ranked-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --out "${MLXFAST_MEASURE_OUT}"
          test -s "${MLXFAST_MEASURE_OUT}/results.json"
          jq -c '{mode, paired}' "${MLXFAST_MEASURE_OUT}/results.json"

      # Overlay measured paired timing onto the sealed gates+semantic score
      # (candidate and baseline seconds/token, speedups, floors, score). Fails
      # the job when a speedup floor fails.
      - name: Overlay paired timing into final score
        if: ${{ inputs.run_benchmark }}
        env:
          MLXFAST_SCORE_PATH: score.json
          MLXFAST_INTEGRITY_PATH: benchmark-integrity.json
          MLXFAST_MEASURE_RESULTS_PATH: ${{ env.MLXFAST_MEASURE_OUT }}/results.json
          MLXFAST_CANDIDATE_SCORE_PATH: ${{ env.MLXFAST_MEASURE_OUT }}/score-candidate.json
          MLXFAST_EXPECTED_COMMIT: ${{ env.MLXFAST_CANDIDATE_SHA }}
        run: .github/scripts/overlay-paired-timing.sh

      - name: Validate benchmark artifacts
        id: validate_benchmark_artifacts
        if: ${{ inputs.run_benchmark }}
        env:
          MLXFAST_SCORE_PATH: score.json
          MLXFAST_INTEGRITY_PATH: benchmark-integrity.json
          MLXFAST_EXPECTED_COMMIT: ${{ env.MLXFAST_CANDIDATE_SHA }}
        run: .github/scripts/validate-benchmark-artifacts.sh

      - name: Check benchmark artifact paths
        if: ${{ inputs.run_benchmark && steps.validate_benchmark_artifacts.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(cat candidate.sha)" = "${MLXFAST_CANDIDATE_SHA}"
          .github/scripts/deny-private-artifacts.sh \
            candidate.sha \
            "${MLXFAST_CORRECTNESS_GOLDEN_PATH}.sha256" \
            "${MLXFAST_CORRECTNESS_GOLDEN_PATH}.bytes" \
            score.json \
            score.json.sha256 \
            benchmark-integrity.json \
            weights.sha256 \
            public-gate-report.json

      - name: Stage benchmark artifacts
        id: stage_benchmark_artifacts
        if: ${{ inputs.run_benchmark && steps.validate_benchmark_artifacts.outcome == 'success' }}
        run: |
          set -euo pipefail
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/benchmark-results" \
            candidate.sha=candidate.sha \
            golden.sha256="${MLXFAST_CORRECTNESS_GOLDEN_PATH}.sha256" \
            golden.bytes="${MLXFAST_CORRECTNESS_GOLDEN_PATH}.bytes" \
            score.json=score.json \
            score.sha256=score.json.sha256 \
            benchmark-integrity.json=benchmark-integrity.json

      - name: Upload benchmark artifacts
        if: ${{ inputs.run_benchmark && steps.stage_benchmark_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # run_id-only name is the orchestrator's lookup contract; overwrite
          # so a re-run that reached this step again does not 409.
          name: benchmark-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/benchmark-results
          if-no-files-found: error
          overwrite: true

      # Single-machine replacement for the per-machine benchmark-parallel-*
      # intermediates: the timing provenance (paired results with telemetry
      # stats), the transformed-weights hash, and the public tripwire report,
      # so a score dispute can still be traced. Content-vetted by
      # deny-private-artifacts; the paired results carry only workspace paths,
      # commit ids, timings, and telemetry aggregates.
      - name: Stage audit artifacts
        id: stage_audit_artifacts
        if: ${{ always() && inputs.run_benchmark }}
        run: |
          set -euo pipefail
          staged=()
          if [[ -s "${MLXFAST_MEASURE_OUT}/results.json" ]]; then
            cp "${MLXFAST_MEASURE_OUT}/results.json" paired-results.json
            staged+=(paired-results.json=paired-results.json)
          fi
          if [[ -s "${MLXFAST_MEASURE_OUT}/verdict.txt" ]]; then
            cp "${MLXFAST_MEASURE_OUT}/verdict.txt" measure-verdict.txt
            staged+=(measure-verdict.txt=measure-verdict.txt)
          fi
          if [[ -s weights.sha256 ]]; then
            staged+=(weights.sha256=weights.sha256)
          fi
          if [[ -s public-gate-report.json ]]; then
            staged+=(public-gate-report.json=public-gate-report.json)
          fi
          if [[ "${#staged[@]}" -eq 0 ]]; then
            echo "benchmark: no audit artifacts to stage"
            exit 0
          fi
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/benchmark-audit" \
            "${staged[@]}"

      - name: Upload audit artifacts
        if: ${{ always() && inputs.run_benchmark && steps.stage_audit_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/benchmark-audit
          if-no-files-found: ignore
          retention-days: 90

      # A failing score.json is never uploaded raw (its error/token fields can
      # leak hidden-golden values or submitted-code-controlled content); derive
      # and upload the REDACTED failure category instead so operators can tell
      # WHY a run failed.
      - name: Surface redacted benchmark failure
        id: redact_benchmark_failure
        if: ${{ failure() && inputs.run_benchmark }}
        env:
          MLXFAST_BENCHMARK_MODE: single-machine
        run: |
          set -euo pipefail
          .github/scripts/redact-benchmark-failure.sh benchmark-failure.json
          .github/scripts/deny-private-artifacts.sh benchmark-failure.json

      - name: Upload redacted benchmark failure
        if: ${{ failure() && steps.redact_benchmark_failure.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-failure-${{ github.run_id }}-${{ github.run_attempt }}-single-machine
          path: benchmark-failure.json
          if-no-files-found: error
          retention-days: 90

      # Bench-written subdirectories are bench-owned, so the trusted shell may
      # not be able to unlink everything; let bench delete its own tree through
      # the bridge first, then remove the runner-owned shell. The janitor's
      # reset below wipes any bench-owned stragglers in the temp roots and
      # recreates the bench uid regardless.
      - name: Cleanup bench workspace
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${MLXFAST_JOB_WS}" ]]; then
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /bin/sh -c 'find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null; true' || true
            rm -rf "${MLXFAST_JOB_WS}" || true
            if [[ -d "${MLXFAST_JOB_WS}" ]]; then
              echo "::warning::bench workspace residue left at ${MLXFAST_JOB_WS}"
            fi
          fi
          # These trees are runner-owned and may contain hidden fixtures,
          # submission-review output, timing results, or staged artifacts.
          # A deletion failure is an integrity failure, not best-effort cleanup.
          private_cleanup_failed=0
          for private_path in \
            "${MLXFAST_PRIVATE_DIR}" \
            "${MLXFAST_MEASURE_OUT}" \
            "${MLXFAST_ARTIFACT_ROOT}"; do
            if ! rm -rf -- "${private_path}"; then
              echo "::error::could not remove runner-private artifact path: ${private_path}" >&2
              private_cleanup_failed=1
              continue
            fi
            if [[ -e "${private_path}" || -L "${private_path}" ]]; then
              echo "::error::runner-private artifact cleanup failed: ${private_path}" >&2
              private_cleanup_failed=1
            fi
          done
          exit "${private_cleanup_failed}"

      # Post-job reset + signed integrity audit: wipe+recreate the bench uid,
      # then diff the protected surface (sudoers, /opt/bench, PF wiring, launch
      # dirs, runner install) against the signed baseline manifest. ANY drift
      # quarantines the box and fails this run loudly -- a compromised host
      # must never silently publish a score.
      - name: Janitor reset and integrity audit
        if: always()
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_JANITOR}"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::janitor quarantined the box after this run" >&2
            exit 1
          fi
          echo "benchmark: janitor reset + integrity audit clean"
