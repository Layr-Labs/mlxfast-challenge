name: r2-download-test

# Fast, isolated exercise of .github/scripts/download-r2-object.sh with the
# repo's R2 secrets, so endpoint/credential fixes are validated in seconds
# instead of full benchmark runs. Touches only R2: no model, no caches, no
# protected paths. Dispatch-only; the file must be on the default branch
# before it becomes dispatchable.

on:
  workflow_dispatch:
    inputs:
      object_key:
        description: R2 object key to fetch
        required: false
        default: correctness_prompts/laguna-xs-2.1-serial-v2/hidden-correctness-golden-94239d59b435eb8f370c82bcf8c86822d1bbc1094e3650aeff3abc5558137023.json
      runner:
        description: ubuntu-latest avoids the M5 queue; m5-bench tests the real network path
        type: choice
        options:
          - ubuntu-latest
          - m5-bench
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  r2-download:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OBJECT_KEY: ${{ inputs.object_key }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Byte fingerprints only (length + hex of first/last byte): enough to
      # spot an invisible paste byte (0x0a/0x0d/0xa0) without ever printing a
      # value. The endpoint's path segment is a substring of a secret (GitHub
      # only masks full-value matches), so it is reported as a length.
      - name: Sanitized diagnostics (never values)
        run: |
          fp() {
            local v="$1" n f l
            n="$(LC_ALL=C printf '%s' "${v}" | wc -c | tr -d ' ')"
            if [[ "${n}" == "0" ]]; then printf 'length=0'; return; fi
            f="$(LC_ALL=C printf '%s' "${v}" | head -c 1 | xxd -p)"
            l="$(LC_ALL=C printf '%s' "${v}" | tail -c 1 | xxd -p)"
            printf 'length=%s first=0x%s last=0x%s' "${n}" "${f}" "${l}"
          }
          echo "R2_BUCKET_ENDPOINT: $(fp "${R2_BUCKET_ENDPOINT}")"
          echo "R2_ACCESS_KEY_ID: $(fp "${R2_ACCESS_KEY_ID}")"
          echo "R2_SECRET_ACCESS_KEY: length=$(LC_ALL=C printf '%s' "${R2_SECRET_ACCESS_KEY}" | wc -c | tr -d ' ') (bytes withheld)"
          echo "object key: ${OBJECT_KEY}"
          endpoint="${R2_BUCKET_ENDPOINT%/}"
          rest="${endpoint#https://}"
          host="${rest%%/*}"
          base_path="${rest#"${host}"}"
          echo "signed request elements: request_path=<endpoint path, length=${#base_path}>/${OBJECT_KEY} region=auto service=s3 signed_headers=host;x-amz-content-sha256;x-amz-date"
          if [[ -z "${base_path}" ]]; then
            echo "note: endpoint has NO bucket path segment - the key's first segment would be treated as the bucket name"
          fi

      - name: Run the benchmark's download script (same invocation shape)
        run: |
          rc=0
          .github/scripts/download-r2-object.sh "${OBJECT_KEY}" "${RUNNER_TEMP}/r2-test-object" || rc=$?
          echo "script exit code: ${rc}"
          if [[ "${rc}" -eq 0 ]]; then
            echo "downloaded: bytes=$(wc -c < "${RUNNER_TEMP}/r2-test-object" | tr -d ' ') sha256=$(shasum -a 256 "${RUNNER_TEMP}/r2-test-object" | awk '{print $1}')"
          fi
          rm -f "${RUNNER_TEMP}/r2-test-object"
          exit "${rc}"

      # Unsigned probe: HTTP status and response headers plus the R2 error
      # document, which is always a small error XML (Code/Message), never
      # object content. --show-error is deliberately omitted so curl cannot
      # print a URL containing the endpoint secret.
      - name: Failure probe (unsigned status + headers + S3 error XML)
        if: failure()
        run: |
          endpoint="${R2_BUCKET_ENDPOINT%/}"
          echo "== unsigned GET: HTTP status + response headers =="
          rc=0
          curl --silent --max-time 20 --dump-header - --output "${RUNNER_TEMP}/r2-err-body" "${endpoint}/${OBJECT_KEY}" || rc=$?
          echo "probe curl exit: ${rc}"
          echo "== R2 error document =="
          LC_ALL=C tr -d '[:cntrl:]' < "${RUNNER_TEMP}/r2-err-body" | head -c 400 || true
          echo
          rm -f "${RUNNER_TEMP}/r2-err-body"
