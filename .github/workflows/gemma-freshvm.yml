name: gemma-freshvm

# Isolated control: N INDEPENDENT jobs, each on a fresh throwaway VM, each running
# the FULL `./benchmark.sh` exactly ONCE. No back-to-back, no sustained load, no
# shared state -- every measurement is a cold, independent single shot (the real
# ranked cadence). Compares against the back-to-back fullbench (floor ~0.140,
# ~43% spike rate) to answer: do the ~2-3x decode spikes appear on fresh isolated
# VMs too (=> host-periodic, real) or only under continuous running (=> artifact)?
#
# Each matrix entry is a separate GitHub job => separate runner => fresh VM. We log
# VM uptime per job to confirm freshness. Full benchmark needs a benchmark oracle
# (public golden lacks it), so each VM builds one. Gates off (no public GPQA
# fixtures; does not affect timed numbers). Baked Gemma cache => no re-download.
# NOT part of CI or scoring.
on:
  # Registered; dispatch-only. Run via gh workflow run once budget is topped.
  workflow_dispatch:
    inputs:
      runs:
        description: 'JSON array of independent-run indices (one fresh VM each).'
        required: false
        default: "[1,2,3,4,5,6]"
        type: string

concurrency:
  group: gemma-freshvm-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: "run ${{ matrix.run }} (fresh vm)"
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1,2,3,4,5,6]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 60
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
      # Eager decode: the mlx-swift-lm rebase's compiled-decode path charges a
      # one-time compile to the (128-step) decode window, so eager is the right
      # default here. Applies to both oracle generation and the timed benchmark so
      # their greedy tokens match. See the mlx-swift-lm rebase notes.
      DARKBLOOM_COMPILED_DECODE: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host identity + VM freshness
        run: |
          set -uo pipefail
          boot=$(sysctl -n kern.boottime 2>/dev/null | grep -oE 'sec = [0-9]+' | grep -oE '[0-9]+' | head -1)
          now=$(date +%s); up=$(( now - ${boot:-now} ))
          { echo "run=${{ matrix.run }}"; echo "model=$(sysctl -n hw.model 2>/dev/null||true)";
            echo "os=$(sw_vers -productVersion 2>/dev/null||true)"; echo "boot_epoch=${boot:-NA}";
            echo "uptime_s=${up}"; echo "started=$(date -u +%FT%TZ)"; } | tee host.txt
          echo "VM uptime at job start: ${up}s (small => fresh VM)"

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" --output weights

      - name: Build benchmark-oracle golden on this VM
        run: |
          set -euo pipefail
          .build/release/mlxfast-swift generate-golden \
            --prompt-file correctness_prompts/public_longcopy_gate_english_512.txt \
            --weights weights --tokenizer "${MLXFAST_REFERENCE_DIR}" \
            --output oracle_src.json --name benchoracle --steps 200
          python3 - <<'PY'
          import json
          gen = json.load(open("oracle_src.json")); c = gen["cases"][0]
          prompt = c["prompt_tokens"]; exp = c["expected_tokens"]
          assert len(prompt) == 512 and len(exp) >= 129
          json.dump({"version":1,"cases":gen["cases"],"benchmark":{
              "prefill_prompt_tokens":prompt,"expected_prefill_token":exp[0],
              "decode_seed_tokens":prompt,"expected_decode_seed_token":exp[0],
              "expected_decode_tokens":exp[1:]}}, open("bench_oracle_golden.json","w"))
          print("oracle assembled")
          PY
          test -s bench_oracle_golden.json

      - name: ONE full benchmark (single cold shot)
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          MLXFAST_CORRECTNESS_GOLDEN_PATH: bench_oracle_golden.json
          MLXFAST_BENCHMARK_CHECK_GATES: "0"
        run: |
          set -uo pipefail
          R="${{ matrix.run }}"
          up=$(grep '^uptime_s=' host.txt | cut -d= -f2)
          pl=$(sudo -n powermetrics -n 1 -i 300 --samplers thermal 2>/dev/null \
                | grep -i 'Current pressure level' | sed 's/.*: *//' | tr -d ' \r' | head -1)
          ts=$(date +%s)
          ./benchmark.sh >/dev/null 2>&1 || true
          cp score.json "score-run-${R}.json" 2>/dev/null || true
          row=$(python3 - <<'PY'
          import json
          try:
              s=json.load(open("score.json")); m=s["metrics"]
              def g(k):
                  v=m.get(k); return v if v is not None else "NA"
              print(g("decode_seconds_per_token"), g("prefill_seconds_per_token"), s.get("passed","NA"),
                    g("timed_benchmark_seconds"), g("benchmark_wall_seconds"), g("peak_ram_gb"),
                    g("decode_speedup"), g("prefill_speedup"))
          except Exception:
              print("NA NA NA NA NA NA NA NA")
          PY
          )
          echo "run epoch uptime_s pressure decode prefill passed timed_s wall_s peak_ram dspeedup pspeedup" > "run-${R}.txt"
          echo "${R} ${ts} ${up:-NA} ${pl:-NA} ${row}" | tee -a "run-${R}.txt"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-freshvm-${{ github.run_id }}-run-${{ matrix.run }}
          path: |
            run-${{ matrix.run }}.txt
            host.txt
            score-run-${{ matrix.run }}.json
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [measure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download run artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-freshvm-${{ github.run_id }}-run-*
          path: samples
          merge-multiple: false
      - name: Aggregate independent fresh-VM shots
        run: |
          set -uo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, statistics as st
          def num(x):
              try: return float(x)
              except Exception: return None
          rows=[]
          for fp in sorted(glob.glob("samples/**/run-*.txt", recursive=True)):
              for line in open(fp):
                  p=line.split()
                  if len(p)<12 or p[0]=="run": continue
                  rows.append({"run":p[0],"uptime":num(p[2]),"pressure":p[3],
                               "decode":num(p[4]),"prefill":num(p[5]),"passed":p[6],
                               "timed":num(p[7]),"wall":num(p[8]),"peak_ram":num(p[9])})
          print("## Fresh-VM isolated single shots (one full benchmark per throwaway VM)")
          print()
          print("| run | uptime_s | pressure | decode s/tok | prefill s/tok | timed_s | wall_s | peak_ram | passed |")
          print("|---|---|---|---|---|---|---|---|---|")
          for r in sorted(rows, key=lambda r:r["run"]):
              print(f"| {r['run']} | {r['uptime']} | {r['pressure']} | {r['decode']} | {r['prefill']} "
                    f"| {r['timed']} | {r['wall']} | {r['peak_ram']} | {r['passed']} |")
          dec=[r["decode"] for r in rows if r["decode"]]; pre=[r["prefill"] for r in rows if r["prefill"]]
          def cv(xs): return (st.pstdev(xs)/st.mean(xs)*100) if len(xs)>1 and st.mean(xs) else float("nan")
          print()
          if dec:
              floor=min(dec); spikes=[v for v in dec if v>1.5*floor]
              print(f"- **decode**: n={len(dec)} floor={floor:.4f} max={max(dec):.4f} median={st.median(dec):.4f} "
                    f"CV={cv(dec):.1f}%  max/floor={max(dec)/floor:.2f}x  spikes>1.5xfloor={len(spikes)}/{len(dec)}")
          if pre:
              print(f"- **prefill**: n={len(pre)} min={min(pre):.4f} max={max(pre):.4f} median={st.median(pre):.4f} CV={cv(pre):.1f}%")
          ups=[r["uptime"] for r in rows if r["uptime"] is not None]
          if ups: print(f"- VM uptime at job start: min={min(ups)}s max={max(ups)}s (small+varied => each was a fresh VM)")
          print()
          print("### Verdict vs the back-to-back fullbench (floor ~0.140, ~43% spike rate)")
          if dec:
              floor=min(dec); rate=len([v for v in dec if v>1.5*floor])/len(dec)*100
              if rate < 15:
                  print(f"- Isolated fresh-VM shots are ~all at the floor (spike rate {rate:.0f}%) => **the spikes were a "
                        f"CONTINUOUS-RUNNING artifact; a single cold shot per fresh VM is stable.**")
              elif rate > 30:
                  print(f"- Isolated fresh-VM shots spike at a similar rate ({rate:.0f}%) => **the cap is HOST-PERIODIC, "
                        f"independent of continuous running; the real ranked single shot is equally exposed.**")
              else:
                  print(f"- Intermediate spike rate ({rate:.0f}%) => partial: continuous running worsens it but does not "
                        f"fully explain it.")
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-freshvm-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
