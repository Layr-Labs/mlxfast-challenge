# m5-bench-timing -- self-hosted M5 timing machine for the mlxfast challenge.
#
# STAGED OPERATOR FILE. This does NOT live in the challenge repo's .github/
# (trusted surface, out of scope for submissions). Commit it to the operator
# ops repo/fork under .github/workflows/m5-bench-timing.yml -- see
# RUNBOOK.md "Where this workflow lives".
#
# Mirrors the semantics of the challenge's benchmark-timing-or-gates.yml
# timing machine (mode=timing: ONLY the timed prefill/decode measurement;
# base case and anchor/free-run/behavior/GPQA gates are skipped), adapted for
# bare-metal self-hosting:
#   - untrusted steps (build, transform, benchmark, oracle generation) run as
#     the `bench` uid through Workstream A's /opt/bench/bench-exec.sh bridge
#     (uid drop + PF egress block + workspace-write restriction for the
#     parent; the harness applies its own hardened Seatbelt profile to its
#     worker child via the MLXFAST_RUNTIME_WORKER_SANDBOX_PROFILE /
#     MLXFAST_USE_RUNTIME_WORKER env the bridge exports -- macOS refuses
#     nested sandbox-exec, so the bridge must NOT wrap commands in its own
#     sandbox-exec)
#   - host-side thermal gate (GPU <= 40C) + 2 Hz macmon telemetry +
#     telemetry-validated acceptance (reject throttling below 1600 MHz under
#     load, token mismatches, crashes, missing metrics; tolerate band/floor
#     policy failures whose M4-calibrated constants are meaningless here)
#   - paired-baseline: measured against the PINNED PREBUILT baseline tree in
#     the same session (no rebuild), cancelling host drift, instead of
#     trusting an absolute constant
#   - the benchmark oracle is SELF-GENERATED per implementation (M4 goldens
#     mis-predict near-tie argmaxes on this M5) and cached per binary hash.
#
# Dispatch-only, submission branches only: GitHub's hard rule for self-hosted
# safety is no PR/push triggers, so nothing runs without an operator's
# explicit dispatch, and the guard step refuses non-submissions/* refs.

name: m5-bench-timing

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Operator note recorded with the run"
        required: false
        type: string
        default: ""
      candidate_only:
        description: "Skip baseline pairing (smoke runs only; never for ranking)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    # NEVER add pull_request/push triggers to this workflow, and never widen
    # runs-on: the m5-bench label is only on the quarantine-supervised box.
    runs-on: [self-hosted, macos, m5-bench]
    timeout-minutes: 180
    # One job at a time is guaranteed by the JIT/ephemeral runner
    # registration; deliberately no `concurrency:` block.
    env:
      BENCH_RUNNER_HOME: /opt/bench-runner
      MEASURE_JOB: /opt/bench-runner/measure-job.sh
      MEASURE_STATE_DIR: /opt/bench-runner/state
      BENCH_EXEC: /opt/bench/bench-exec.sh
      BENCH_USER: bench
      QUARANTINE_FLAG: /opt/bench/quarantine.flag
      # Pinned prebuilt baseline (runner-owned, read-only, never rebuilt in a
      # job). Regeneration procedure: RUNBOOK.md "Regenerating the pinned
      # baseline".
      BASELINE_WS: /opt/bench-runner/baseline/current
      BASELINE_CALIBRATION: /opt/bench-runner/state/baseline-calibration.json
      # Persistent, runner-owned reference checkpoint (downloaded once at
      # install; must be readable by the bench uid for transform).
      MLXFAST_REFERENCE_DIR: /opt/bench-runner/cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - name: Enforce dispatch-on-submission-branch contract
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "m5-bench-timing: refusing event ${GITHUB_EVENT_NAME}; workflow_dispatch only" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != submissions/* ]]; then
            echo "m5-bench-timing: refusing ref ${GITHUB_REF_NAME}; dispatch on submissions/* branches only" >&2
            exit 1
          fi

      # Trusted host preflight BEFORE any submitted code is checked out:
      # quarantine flag absent, no darkbloom-class processes, 1-min load < 2,
      # GPU util ~0. The darkbloom provider staying unloaded is a permanent
      # precondition of this box (see RUNBOOK.md).
      - name: Preflight host quiescence
        run: |
          set -euo pipefail
          "${MEASURE_JOB}" --preflight-only --tag "preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Checkout candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything outside editablePaths must be bit-identical to origin/main
      # before ANY repo script is treated as trusted (setup/benchmark scripts
      # are trusted only because this proves they match main). Inline trusted
      # text -- deliberately NOT calling a script from the checked-out branch.
      - name: Enforce modifiable surface
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          echo "m5-bench-timing: merge-base=${base}"
          violations="$(git diff --name-only "${base}" HEAD -- \
            | grep -Ev '^Sources/(MLXFastModel|MLXFastTransform)/' || true)"
          if [[ -n "${violations}" ]]; then
            echo "m5-bench-timing: submission modifies files outside the editable surface:" >&2
            echo "${violations}" >&2
            exit 1
          fi

      # The workspace is runner-owned; grant the bench uid ACL access so the
      # bridge-dropped build/transform/benchmark can read and write it. ACLs
      # on files you own need no root.
      - name: Grant bench uid access to workspace
        run: |
          set -euo pipefail
          /bin/chmod -R +a "user:${BENCH_USER} allow list,search,readattr,readextattr,read,execute,add_file,add_subdirectory,delete_child,write,append,writeattr,writeextattr,file_inherit,directory_inherit" \
            "${GITHUB_WORKSPACE}"

      # Trusted network step: dependency resolution runs as `runner` (bench
      # has no egress). Package.swift/Package.resolved were just proven
      # identical to main, so the manifests are trusted content.
      - name: Resolve SwiftPM dependencies
        run: |
          set -euo pipefail
          swift package resolve

      - name: Verify reference checkpoint
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "m5-bench-timing: reference checkpoint missing at ${MLXFAST_REFERENCE_DIR}" >&2
            echo "m5-bench-timing: provision it once per INSTALL-workstream-B.md (operator step); jobs never download 18 GB" >&2
            exit 1
          fi

      # ---- Untrusted from here: submitted code compiles and runs only as
      # ---- the bench uid through the bridge.
      - name: Build candidate (bench-exec)
        run: |
          set -euo pipefail
          sudo -u "${BENCH_USER}" "${BENCH_EXEC}" "${GITHUB_WORKSPACE}" \
            /usr/bin/env MJOB_WS="${GITHUB_WORKSPACE}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              mkdir -p .build/clang-module-cache
              export CLANG_MODULE_CACHE_PATH="${PWD}/.build/clang-module-cache"
              swift build -c release
              if [[ ! -s .build/release/mlx.metallib ]]; then
                tools/build-mlx-metallib.sh
              fi
              test -x .build/release/mlxfast-swift
              test -s .build/release/mlx.metallib
            '

      - name: Transform reference checkpoint (bench-exec)
        run: |
          set -euo pipefail
          sudo -u "${BENCH_USER}" "${BENCH_EXEC}" "${GITHUB_WORKSPACE}" \
            /usr/bin/env MJOB_WS="${GITHUB_WORKSPACE}" REF_DIR="${MLXFAST_REFERENCE_DIR}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              mkdir -p weights
              .build/release/mlxfast-swift transform \
                --reference "${REF_DIR}" \
                --output weights
              test -f weights/config.json
            '

      # Thermal gate, self-generated per-binary oracle (cached), timed
      # candidate run with 2 Hz telemetry, acceptance with one gated retry,
      # pinned prebuilt baseline measured the same way, calibration sanity
      # band, paired ratio, sealed results.json -- all inside measure-job.sh.
      # Untrusted phases go through bench-exec; gate/telemetry/sealing/
      # pairing run trusted as `runner`.
      - name: Measure (paired official benchmark)
        id: measure
        env:
          # Routed through env: rather than interpolated into the run: body --
          # ${{ inputs.* }} substitutes as a literal string before bash ever
          # sees it, so inlining it is a script-injection vector. Matches the
          # convention of the challenge repo's active workflows.
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          set -euo pipefail
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          extra=()
          if [[ "${CANDIDATE_ONLY}" == "true" ]]; then
            extra+=(--candidate-only)
          fi
          "${MEASURE_JOB}" \
            --candidate "${GITHUB_WORKSPACE}" \
            --tag "${tag}" \
            --out "${RUNNER_TEMP}/measure-${tag}" \
            ${extra[@]+"${extra[@]}"}
          echo "out_dir=${RUNNER_TEMP}/measure-${tag}" >> "${GITHUB_OUTPUT}"

      - name: Report
        if: always()
        env:
          # inputs.note is free-form operator text; env-route it (and the step
          # output, for consistency) instead of inlining into the script body.
          NOTE: ${{ inputs.note }}
          OUT_DIR: ${{ steps.measure.outputs.out_dir }}
        run: |
          set -euo pipefail
          out="${OUT_DIR}"
          {
            echo "## m5-bench-timing"
            echo '```'
            echo "ref:  ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo "note: ${NOTE}"
            if [[ -n "${out}" && -s "${out}/results.json" ]]; then
              jq -r '
                "verdict:          ACCEPT",
                "candidate decode: \(.candidate.decode_seconds_per_token) s/token",
                "candidate prefill:\(.candidate.prefill_seconds_per_token) s/token",
                (if .paired != null then
                  "baseline decode:  \(.baseline.decode_seconds_per_token) s/token",
                  "baseline prefill: \(.baseline.prefill_seconds_per_token) s/token",
                  "paired decode_speedup:  \(.paired.decode_speedup)",
                  "paired prefill_speedup: \(.paired.prefill_speedup)",
                  "paired score:           \(.paired.paired_score)"
                else "mode: candidate-only (no pairing)" end)
              ' "${out}/results.json"
            else
              echo "verdict: FAILED (no results.json; see measure.log artifact)"
              [[ -n "${out}" && -s "${out}/verdict.txt" ]] && cat "${out}/verdict.txt"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Sealed score/results, full telemetry, verdicts, and logs. The oracle
      # here is self-generated from a public prompt (no hidden goldens exist
      # on this rig), so logs are not leak-sensitive the way the official
      # runner's are.
      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m5-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.measure.outputs.out_dir }}
          if-no-files-found: error
          retention-days: 90
